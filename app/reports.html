<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>LeadPro Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== The APPROVED client-report look (claude/LeadPro_Reports_Client_Report_preview.html), copied as is ===== */
:root{--bg:#f4f5f8;--card:#fff;--line:#e3e6ec;--ink:#16213d;--muted:#6b7280;--navy:#1b2a4e;--gold:#b8862b;--gold-l:#f6ecd6;--good:#1f9d55;--good-l:#e3f4ea;--bad:#d64545;--bad-l:#fbe7e7;--blue:#4a78c2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 40px}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.brand .t{font-weight:800;font-size:18px;letter-spacing:-.2px}
.brand .s{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;background:#fff;display:flex;gap:8px;align-items:center}
.pill b{font-weight:600}
.pdf{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.tabs{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:4px}
.tab{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.row{display:grid;gap:14px;margin-bottom:14px}
.r4{grid-template-columns:repeat(4,1fr)}.r3{grid-template-columns:1fr 1fr 1.6fr}.r2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ct{font-size:12.5px;font-weight:600;color:var(--muted)}
.src{font-size:10.5px;color:var(--muted);background:var(--bg);border-radius:5px;padding:2px 6px}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.chg{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:6px}
.up{color:var(--good);background:var(--good-l)}.dn{color:var(--bad);background:var(--bad-l)}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.sec{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}
.sec h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
.sec .l{font-size:12.5px;color:var(--muted)}
.bl{display:grid;gap:12px;margin-top:6px}
.bl .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bl .b{height:8px;background:#eef0f4;border-radius:5px;overflow:hidden}.bl .b div{height:100%;background:var(--navy);border-radius:5px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.rk{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;background:#eef0f4}
.rk.t5{background:var(--gold-l);color:#7a5714}
.na{color:#b4b9c4}
footer{margin-top:26px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
/* ===== Added for the Rankings tab (same tokens; from the prototype's Rankings tab) ===== */
.r21{grid-template-columns:2fr 1fr}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tools input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px;font:inherit}
.sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.sw button{border:0;background:none;padding:6px 11px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}.sw button.on{background:var(--navy);color:#fff;font-weight:600}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
.scroll{max-height:460px;overflow:auto}
.tab.soon{color:#b4b9c4}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* ===== Phone (the approved mockup had no phone layout) ===== */
@media (max-width:760px){
 .hd{flex-direction:column;align-items:flex-start;gap:12px;padding:14px 16px}
 .ctl{flex-wrap:wrap}
 .tabs{padding:0 16px;overflow-x:auto}
 .wrap{padding:0 16px 32px}
 .r4{grid-template-columns:1fr 1fr}.r3,.r2,.r21{grid-template-columns:1fr}
 .big{font-size:28px}
 .ch{flex-wrap:wrap;gap:4px 8px;align-items:flex-start}
 .legend{flex-wrap:wrap;gap:4px 10px}
 .tools input{min-width:0;flex:1 1 100%}
 .card.tbl{overflow-x:auto}
 footer{flex-direction:column;gap:6px}
}
/* ===== Added for Phases 2–4 (from the approved Overview preview + the prototype tabs; same tokens) ===== */
.sum{margin:22px 0 18px;background:var(--navy);color:#fff;border-radius:14px;padding:22px 26px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.sum h1{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.sum h1 span{color:#f2c46b}
.sum p{color:#c9d1e3;margin-top:8px;font-size:13.5px;line-height:1.5}
.sum ul{list-style:none;display:grid;gap:8px}
.sum li{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;color:#e6eaf3}
.sum li i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none}
.g1{background:#2f7d55}.r1{background:#a33a3a}.n1{background:#5a6a92}
.sec a,.sec .go{font-size:12.5px;color:var(--gold);font-weight:700;text-decoration:none;cursor:pointer}
.mini{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}.mini div{font-size:12px;color:var(--muted)}.mini b{display:block;font-size:18px;color:var(--ink)}
.priv{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:10px}
.flat{color:var(--muted);background:#f0f1f4}
.r12{grid-template-columns:1fr 2fr}
.tab{cursor:pointer;white-space:nowrap}
@media (max-width:760px){.sum{grid-template-columns:1fr;padding:18px}.sum h1{font-size:21px}.r12{grid-template-columns:1fr}.tabs{gap:0}}
/* ===== v1.37.0 page parts the static preview didn't need (same tokens) ===== */
.pill.pdf{cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
.agency{display:none}
.agency.on{display:block;height:30px;width:auto;padding-left:12px;margin-left:2px;border-left:1px solid var(--line)}
.draft{background:var(--gold-l);color:#7a5714;border-bottom:1px solid #ecd9ae;font-size:12.5px;font-weight:600}
.draft div{max-width:1180px;margin:0 auto;padding:8px 24px}
.lock{max-width:440px;margin:40px auto;text-align:left}
.lock h2{font-size:18px;font-weight:800;margin-bottom:6px}.lock p{color:var(--muted);font-size:13px;margin-bottom:12px}
.lock form{display:flex;gap:8px;flex-wrap:wrap}
.lock input{flex:1 1 220px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
.lock button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.lock .err{color:var(--bad);font-size:12.5px;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* v1.39.0: the date pill opens a menu (same tokens) */
.dp{position:relative}
.pill.dt{cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink)}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(22,33,61,.12);padding:6px;min-width:190px}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--bg);outline:0}.menu button.on{font-weight:700}.menu button.on::after{content:"✓";color:var(--gold)}
.more{border:0;background:none;color:var(--gold);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:8px 0 0}
@media (max-width:760px){.draft div{padding:8px 16px}svg.ln{height:auto}}   /* FIX 7.1: line charts scale with the width on phones (no empty band) */
@media print{.ctl,.tools,.draft,.menu,.more{display:none}.scroll{max-height:none}}
/* ===== v1.45.0 (queue item 16, preview report-brand.html): brand row like the review pages: LeadPro | agency | client ===== */
.brow{border-bottom:1px solid var(--line);background:#fff}.brow-in{max-width:1180px;margin:0 auto;padding:16px 24px}
.bb{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.bb .b{display:flex;align-items:center;gap:8px;min-width:0}
.bb .b + .b{padding-left:20px;border-left:1px solid var(--line)}
.lp-word{font:600 22px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink)}.lp-word span{color:var(--gold)}
.bb .wpp-logo{display:block;height:30px;width:auto}
.bb .client-img{display:block;height:34px;width:auto;max-width:220px;object-fit:contain;background:#fff;padding:6px 10px;border-radius:8px;box-sizing:content-box}
.bb .firm-word{font:600 19px/1.2 Inter,system-ui,sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
@media (max-width:760px){.brow-in{padding:12px 16px}.bb{gap:10px;flex-wrap:nowrap}.bb .b + .b{padding-left:10px}.bb .b svg{width:26px;height:26px}.bb .b{gap:6px}.lp-word{font-size:17px}.lfmp-logo{width:96px!important;height:28px!important}.bb .wpp-logo{height:24px}.bb .client-img{height:30px;max-width:92px;padding:0;background:none}.bb .firm-word{font-size:14px;max-width:110px}}
</style></head><body>
<header>
 <div class="brow" id="brow" hidden><div class="brow-in"><div class="bb" id="bb" role="img" aria-label="LeadPro"></div></div></div>
 <div class="hd">
  <div class="brand">
   <div><div class="t" id="firm">LeadPro Reports</div><div class="s" id="sub">LeadPro Reports</div></div><img class="agency" id="agency" alt="Web Promotion Partners" height="30"></div>
  <div class="ctl"><div class="dp"><button type="button" class="pill dt" id="dt" aria-haspopup="menu" aria-expanded="false"><b id="dtl">Last 30 days</b> ▾</button><div class="menu" id="dtm" role="menu" hidden></div></div><span class="pill">vs previous period ▾</span><button type="button" class="pill pdf" id="pdf">Download PDF</button></div>
 </div>
 <div class="tabs" id="tabs" role="tablist" aria-label="Report sections"></div>
</header>
<div class="draft" id="draft" hidden><div>Draft · your LFMP team is reviewing this page. It isn't in your GHL menu yet.</div></div>
<div class="wrap" id="body"><p class="note" style="margin-top:26px">Loading…</p></div>
<script type="module">
// v1.39.0 LeadPro Reports (queue items 7–9): every tab of the approved client report ("Claude outputs/reports-preview/
// report-full.html"; Overview = the page PJ approved): Overview, Calls, Website leads (CallRail), Google Search (Search
// Console), Website traffic (GA4), Google Business Profile, Rankings (BrightLocal, Phase 1), Ads (Google Ads). Tabs show only
// for linked sources. A Live report shows its client only the tabs the team published ("Publish new tabs", after Andy);
// ?drafts=1 (the team's "Open report (with drafts)") shows the draft tabs too, under a Draft banner. A whole-report Draft
// works as in Phase 1. Loaded by the firm stub firms/<slug>/reports.html. Reads only this firm's files: ./reports-config.json,
// ./data/kpis.json (name, brand) and ./reports.json (numbers only, encrypted with the firm's KPI passphrase; unlocked with
// the same passphrase as its KPI dashboard: the #k=… link key from GHL, or the one saved in this browser, or typed).
const PATH_FIRM = /\/firms\/([a-z0-9]+(?:-[a-z0-9]+)*)\/(?:reports\.html)?$/.exec(location.pathname);
const QS = new URLSearchParams(location.search);
const SLUG = PATH_FIRM ? PATH_FIRM[1] : (QS.get('firm') || '').toLowerCase();
const ROOT = location.pathname.replace(/(?:firms\/[^/]+|app)\/[^/]*$/, '');
const FIRM = PATH_FIRM ? './' : `${ROOT}firms/${SLUG}/`;
const { decryptJSON } = await import(`${ROOT}scripts/kpi-core.mjs`);
const C = await import(`${ROOT}scripts/reports-core.mjs`);
const PASS_KEY = `lfmp-pass-${SLUG}`;   // the same saved passphrase as this firm's KPI dashboard
const RANGE_KEY = `lfmp-report-range-${SLUG}`;
const DRAFTS = QS.get('drafts') === '1';
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getJSON = async p => { const r = await fetch(`${FIRM}${p}?t=${Date.now()}`, { cache: 'no-store' }); if (r.status === 404) return null; if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); };

let cfg = null, kpis = null, file = null, R = null;
const S = { tab: QS.get('tab') || '', q: '', top: true, sort: 'vol', range: C.RANGES.some(r => r[0] === store.get(RANGE_KEY)) ? store.get(RANGE_KEY) : C.DEFAULT_RANGE, allQ: false };
const fmtDay = (iso, year = true) => { const d = new Date(`${iso}T12:00:00Z`); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}), timeZone: 'UTC' }); };
const fmtUpdated = iso => { const d = new Date(iso || ''); if (Number.isNaN(d.getTime())) return ''; return `${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'America/New_York' })}, ${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' })} ET`; };
const sign = n => (n > 0 ? `+${n}` : String(n));
const n = x => Number(x || 0).toLocaleString('en-US');
const pc = (a, b) => (b ? Math.round(a / b * 100) : 0);
const k1 = v => (v >= 10000 ? `${Math.round(v / 100) / 10}k` : n(v));
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
// the preview's change chip: ▲ green / ▼ red, or reversed for "lower is better" numbers (missed calls)
const chg = (p, { invert = false } = {}) => (p == null ? '' : p === 0 ? '<span class="chg flat">0%</span>' : `<span class="chg ${(p > 0) !== invert ? 'up' : 'dn'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`);
const rk = v => (v == null ? '<span class="na">–</span>' : `<span class="rk ${v <= 5 ? 't5' : ''}">${v}</span>`);
const card = (t, src, v, c, note, mini) => `<div class="card"><div class="ch"><span class="ct">${t}</span>${src ? `<span class="src">${src}</span>` : ''}</div><div><span class="big">${v}</span>${c || ''}</div>${note ? `<div class="note">${note}</div>` : ''}${mini || ''}</div>`;
const bars = (list, c) => { const mx = Math.max(...list.map(x => x[1])) || 1; return `<div class="bl">${list.map(([k, v]) => `<div><div class="t"><span>${esc(k)}</span><b>${n(v)}</b></div><div class="b"><div style="width:${Math.max(v / mx * 100, 1.5)}%${c ? `;background:${c}` : ''}"></div></div></div>`).join('')}</div>`; };
const sec = (h2, l, go) => `<div class="sec"><div><h2>${h2}</h2>${l ? `<div class="l">${l}</div>` : ''}</div>${go && tabs().includes(go) ? `<span class="go" data-t="${esc(go)}" role="link" tabindex="0">Open ${esc(go)} →</span>` : ''}</div>`;
const niceMax = v => { const raw = Math.max(v, 1) / 3, p = 10 ** Math.floor(Math.log10(raw)); const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw); return { max: step * 3, ticks: [0, step, step * 2, step * 3].map(x => Math.round(x * 10) / 10) }; };
const dayLabel = d => new Date(`${d}T12:00:00Z`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
function lineSvg(series, labels, o) {
  const W = o.w || 560, H = o.h || 190, L = 34, Rr = 22, T = 10, B = 26, mn = o.min ?? 0, mx = o.max, len = Math.max(labels.length - 1, 1);
  const x = i => L + i * (W - L - Rr) / len, y = v => { let t = (v - mn) / (mx - mn); if (o.inv) t = 1 - t; return T + (1 - t) * (H - T - B); };
  const every = labels.length <= 8 ? 1 : Math.ceil(labels.length / 7);
  let g = '';
  o.ticks.forEach(v => g += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f4"/><text x="${L - 8}" y="${y(v) + 4}" font-size="10" fill="#6b7280" text-anchor="end">${v}</text>`);
  labels.forEach((l, i) => { if (i % every === 0 || i === labels.length - 1 && labels.length <= 8) g += `<text x="${x(i)}" y="${H - 6}" font-size="10" fill="#6b7280" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s => {
    const pts = s.d.map((v, i) => (v == null ? null : [x(i), y(v), v, i])).filter(Boolean);
    g += `<polyline points="${pts.map(p => `${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="${s.c}" stroke-width="${s.w || 2.6}"/>`;
    if (s.dots !== false && labels.length <= 31) pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="${s.c}" stroke-width="2"><title>${esc(labels[p[3]])}: ${p[2]}</title></circle>`);
  });
  return `<svg class="ln" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.label || 'chart')}">${g}</svg>`;
}
function donut(a, b) {
  const Cc = 389.6, fa = +(a + b ? a / (a + b) * Cc : 0).toFixed(1);
  return `<svg viewBox="0 0 200 170" width="100%" height="170" role="img" aria-label="Answered vs missed"><circle cx="100" cy="85" r="62" fill="none" stroke="#eef0f4" stroke-width="22"/><circle cx="100" cy="85" r="62" fill="none" stroke="#1b2a4e" stroke-width="22" stroke-dasharray="${fa} ${Cc}" transform="rotate(-90 100 85)"/><circle cx="100" cy="85" r="62" fill="none" stroke="#d64545" stroke-width="22" stroke-dasharray="${+(Cc - fa).toFixed(1)} ${Cc}" stroke-dashoffset="${-fa}" transform="rotate(-90 100 85)"/><text x="100" y="82" text-anchor="middle" font-size="26" font-weight="800" fill="#16213d">${pc(a, a + b)}%</text><text x="100" y="100" text-anchor="middle" font-size="11" fill="#6b7280">answered</text></svg><div class="legend" style="justify-content:center"><span><i style="background:#1b2a4e"></i>Answered ${a}</span><span><i style="background:#d64545"></i>Missed ${b}</span></div>`;
}
const footer = () => {
  const wpp = (kpis?.agency || cfg?.reportsOnly?.agency) === 'WPP' ? ' · Web Promotion Partners' : '';
  const when = fmtUpdated(file?.generatedAt);
  return `<footer><span>LeadPro Reports · Data refreshed nightly${when ? ` · Last updated ${esc(when)}` : ''}${wpp}</span><span>Questions? Contact your Client Success Manager.</span></footer>`;
};

// ---------------------------------------------------------------- which tabs
// Linked sources only; a Live report shows its published tabs (plus the drafts with ?drafts=1). A tab whose numbers
// haven't arrived yet still shows (with "first numbers after tonight's update").
const tabs = () => C.visibleTabs(cfg, { drafts: DRAFTS });
const draftsShown = () => (DRAFTS ? C.draftTabs(cfg) : []);
const range = () => C.rangeFor(S.range, R?.through || C.throughOf(file?.generatedAt || new Date().toISOString()));

// v1.45.0 (queue item 16): the review pages' brand row (LeadPro | LFMP or WPP | the client's logo, or its name as text).
// From reports-config.json "brand" (the Builder copies the record's logo there); before unlock too (nothing secret in it).
function brandRow() {
  const b = cfg?.brand || {}, agency = (b.agency || cfg?.reportsOnly?.agency || kpis?.agency) === 'WPP' ? 'WPP' : 'LFMP';
  const name = b.name || cfg?.reportsOnly?.name || kpis?.location || cfg?.firmName || '';
  const agencyName = agency === 'WPP' ? 'Web Promotion Partners' : 'Law Firm Marketing Pros';

  <div class="card"><div class="ch"><span class="ct">Profile views</span><span class="src">Google Business</span></div><div class="big">${n(G.views)}</div><div class="mini"><div><b>${n(G.vs)}</b>on Google Search</div><div><b>${n(G.vm)}</b>on Google Maps</div></div></div></div>`;
  return h;
}
function ads() {
  const r = range(), A = C.adsIn(R.ads, r);
  if (!A) return waiting('Ads', 'Your Google Ads numbers');
  let h = sec('Ads', 'Google Ads spend and the leads it brought in.');
  h += `<div class="row r4">${card('Spend', 'Google Ads', C.money(A.cost, A.currency))}${card('Leads from ads', 'Google Ads', n(A.conv), '', 'Conversions in Google Ads')}${card('Cost per lead', 'Google Ads', C.money(A.cpl, A.currency), cplChip(A))}${card('Clicks', 'Google Ads', n(A.clicks))}</div>`;
  h += `<div class="card tbl"><div class="ch"><span class="ct">Campaigns</span></div>${A.campaigns.length ? `<table><tr><th>Campaign</th><th>Spend</th><th>Leads</th><th>Cost per lead</th></tr>${A.campaigns.map(c => `<tr><td>${esc(c.name)}</td><td>${C.money(c.cost, A.currency)}</td><td>${n(c.conv)}</td><td>${C.money(c.cpl, A.currency)}</td></tr>`).join('')}</table>` : '<div class="note">No ad spend in this period.</div>'}</div>`;
  return h;
}
function rankings() {
  if (!R.rankings) return waiting('Google rankings', 'Your rankings');
  const RR = R.rankings, sm = RR.summary, rep = RR.report, N = sm.tracked;
  const kpi = (t, v, c, nn) => card(t, 'BrightLocal', v, c, nn);
  let h = '';
  const vs = rep.prevRunAt ? ` vs ${fmtDay(rep.prevRunAt, false)}` : '';
  h += `<div class="sec"><div><h2>Google rankings</h2><div class="l">BrightLocal Rank Tracker · ${esc(fmtDay(rep.runAt))}${esc(vs)}${rep.checkedFrom ? ` · checked from ${esc(rep.checkedFrom)}` : ''}. Lower number = higher on the page. Rankings update after each BrightLocal run, not with the date picker.</div></div></div>`;
  h += `<div class="row r4">${kpi('Average Google position', sm.avg ?? '–', avgChip(sm.avgChange), `Across ${N} tracked keywords`)}${kpi('Keywords in the top 20', sm.top20, '', `of ${N} tracked, any search`)}${kpi('Movement', `${sign(sm.movement.keyword)} / ${sign(sm.movement.positional)}`, '', 'keyword / positional change')}${kpi('Google map 3-pack', `${sm.mapPack}%`, '', sm.mapPack ? 'of keywords show you in the map 3-pack' : 'Not in the map results yet')}</div>`;
  const H = RR.history, ax = axis([...H.desktop, ...H.mobile, ...H.localFinder]);
  h += `<div class="row r21"><div class="card"><div class="ch"><span class="ct">Average position by month (higher on the chart = better)</span><div class="legend"><span><i style="background:#1b2a4e"></i>Desktop</span><span><i style="background:#b8862b"></i>Mobile</span><span><i style="background:#4a78c2"></i>Local Finder</span></div></div>${H.months.length ? lineSvg([{ d: H.localFinder, c: '#4a78c2', w: 2.4 }, { d: H.mobile, c: '#b8862b', w: 2.4 }, { d: H.desktop, c: '#1b2a4e', w: 2.4 }], H.months, { w: 620, h: 210, min: ax.min, max: ax.max, inv: true, ticks: ax.ticks, label: 'Average Google position by month' }) : '<div class="empty">The monthly trend appears after the first runs.</div>'}</div>
  <div class="card"><div class="ch"><span class="ct">Positions mix (desktop)</span></div>${bars(RR.mix.bands, '#b8862b')}<div class="note">Rankings past page 1 can shift from day to day; watch the trend.</div></div></div>`;
  let rows = RR.keywords.map(k => ({ ...k, v: k.vol === '<10' ? 5 : Number(String(k.vol).replace(/[^0-9.]/g, '')) || 0 }));
  if (S.top) rows = rows.filter(r => r.d || r.m || r.l);
  if (S.q) rows = rows.filter(r => r.k.toLowerCase().includes(S.q.toLowerCase()));
  const key = S.sort; rows.sort((a, b) => key === 'vol' ? b.v - a.v : key === 'kw' ? a.k.localeCompare(b.k) : ((a[key] ?? 99) - (b[key] ?? 99)));
  h += `<div class="card tbl"><div class="tools"><input id="q" placeholder="Search keywords…" aria-label="Search keywords" value="${esc(S.q)}"><div class="sw"><button type="button" data-top="1" class="${S.top ? 'on' : ''}">In top 20 (${sm.top20})</button><button type="button" data-top="0" class="${!S.top ? 'on' : ''}">All ${N}</button></div><span class="note" style="margin:0">Click a column to sort · "–" = not in the top 20</span></div>
  <div class="scroll"><table><tr><th class="s" data-s="kw">Keyword</th><th class="s" data-s="vol">Monthly searches</th><th class="s" data-s="d">Desktop</th><th class="s" data-s="m">Mobile</th><th class="s" data-s="l">Maps</th><th>Change</th></tr>
  ${rows.map(r => `<tr><td>${esc(r.k)}</td><td>${esc(r.vol)}</td><td>${rk(r.d)}</td><td>${rk(r.m)}</td><td>${rk(r.l)}</td><td>${r.change > 0 ? `<b style="color:#1f9d55">▲ ${r.change}</b>` : r.change < 0 ? `<b style="color:#d64545">▼ ${-r.change}</b>` : '<span class="na">–</span>'}</td></tr>`).join('') || '<tr><td colspan="6" class="na">No keywords match.</td></tr>'}</table></div></div>`;
  if (RR.competitors?.names?.length && RR.competitors.rows?.length) {
    h += `<div class="sec"><div><h2>You vs. competitors</h2><div class="l">Desktop Google ranks, ${esc(fmtDay(rep.runAt, false))} run.</div></div></div>
  <div class="card tbl"><table><tr><th>Keyword</th><th>You</th>${RR.competitors.names.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${RR.competitors.rows.map(c => `<tr><td>${esc(c[0])}</td>${c.slice(1).map(v => `<td>${rk(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  return h;
}
// the y-axis for ranks: the preview's 15–25 when the numbers fit, otherwise widened in 2.5 steps (inverted)
function axis(values) {
  const v = values.filter(x => x != null); if (!v.length) return { min: 15, max: 25, ticks: [15, 17.5, 20, 22.5, 25] };
  let min = Math.min(15, Math.floor(Math.min(...v) / 2.5) * 2.5); const max = Math.max(25, Math.ceil(Math.max(...v) / 2.5) * 2.5);
  if (min < 1) min = 0; const step = (max - min) / 4;
  return { min, max, ticks: [0, 1, 2, 3, 4].map(i => Math.round((min + i * step) * 10) / 10) };
}
const VIEWS = { Overview: overview, Calls: calls, 'Website leads': leads, 'Google Search': search, 'Website traffic': traffic, 'Google Business Profile': gbp, Rankings: rankings, Ads: ads };

function draw() {
  head();
  if (!cfg?.enabled) { $('body').innerHTML = emptyHtml('Not set up yet', 'Your LFMP team hasn\'t set up this report yet.'); return; }
  if (!file) { $('body').innerHTML = emptyHtml('First report coming soon', 'Your numbers appear here after the first nightly update.'); return; }
  if (!R) return;
  if (!S.tab) { $('body').innerHTML = emptyHtml('Coming soon', 'Your LFMP team is getting this report ready.'); return; }
  $('body').innerHTML = VIEWS[S.tab]() + footer();
  const q = $('q'); if (q) q.oninput = e => { S.q = e.target.value; draw(); const nq = $('q'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); };
}
async function unlock(pass) { R = C.asV2(await decryptJSON(file.enc, pass)); store.set(PASS_KEY, pass); }
const menuOpen = open => { $('dtm').hidden = !open; $('dt').setAttribute('aria-expanded', String(open)); if (open) ($('dtm').querySelector('.on') || $('dtm').firstElementChild)?.focus(); };
document.addEventListener('click', e => {
  if (e.target.closest('#dt')) { menuOpen($('dtm').hidden); return; }
  const rg = e.target.closest('[data-range]'); if (rg) { S.range = rg.dataset.range; store.set(RANGE_KEY, S.range); menuOpen(false); draw(); $('dt').focus(); return; }
  if (!e.target.closest('#dtm') && !$('dtm').hidden) menuOpen(false);
  const t = e.target.closest('[data-t]'); if (t) { S.tab = t.dataset.t; S.allQ = false; draw(); if (t.classList.contains('go')) window.scrollTo(0, 0); return; }
  if (e.target.closest('#allQ')) { S.allQ = !S.allQ; draw(); return; }
  const tp = e.target.closest('[data-top]'); if (tp) { S.top = tp.dataset.top === '1'; draw(); return; }
  const so = e.target.closest('[data-s]'); if (so && R) { S.sort = so.dataset.s; draw(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('dtm').hidden) { menuOpen(false); $('dt').focus(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-t]')) { e.preventDefault(); e.target.click(); return; }
  if (!$('dtm').hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const b = [...$('dtm').querySelectorAll('button')], i = b.indexOf(document.activeElement); b[(i + (e.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length].focus(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'unlock') return; e.preventDefault();
  const pass = $('pass').value;
  try { await unlock(pass); draw(); } catch { $('body').innerHTML = lockHtml('That passphrase didn\'t open this report. Check it and try again.'); $('pass').focus(); }
});
$('pdf').addEventListener('click', () => window.print());
(async () => {
  try {
    [cfg, kpis, file] = await Promise.all([getJSON('reports-config.json'), getJSON('data/kpis.json').catch(() => null), getJSON('reports.json')]);
    const m = /(?:^|[#&])k=([^&]+)/.exec(location.hash || '');
    if (m) { store.set(PASS_KEY, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
    const pass = store.get(PASS_KEY);
    if (file && pass) { try { await unlock(pass); } catch { store.set(PASS_KEY, null); } }
    if (file && !R && cfg?.enabled) { head(); $('body').innerHTML = lockHtml(); return; }
    draw();
  } catch (e) { head(); $('body').innerHTML = `<div class="card" style="margin-top:26px"><div class="empty"><b>Couldn't load the report</b>${esc(e.message)}. Please refresh.</div></div>`; }
})();
</script></body></html>
