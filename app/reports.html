<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>LeadPro Reports · Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== The APPROVED client-report look (claude/LeadPro_Reports_Client_Report_preview.html), copied as is ===== */
:root{--bg:#f4f5f8;--card:#fff;--line:#e3e6ec;--ink:#16213d;--muted:#6b7280;--navy:#1b2a4e;--gold:#b8862b;--gold-l:#f6ecd6;--good:#1f9d55;--good-l:#e3f4ea;--bad:#d64545;--bad-l:#fbe7e7;--blue:#4a78c2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 40px}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.brand .t{font-weight:800;font-size:18px;letter-spacing:-.2px}
.brand .s{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;background:#fff;display:flex;gap:8px;align-items:center}
.pill b{font-weight:600}
.pdf{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.tabs{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:4px}
.tab{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.row{display:grid;gap:14px;margin-bottom:14px}
.r4{grid-template-columns:repeat(4,1fr)}.r3{grid-template-columns:1fr 1fr 1.6fr}.r2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ct{font-size:12.5px;font-weight:600;color:var(--muted)}
.src{font-size:10.5px;color:var(--muted);background:var(--bg);border-radius:5px;padding:2px 6px}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.chg{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:6px}
.up{color:var(--good);background:var(--good-l)}.dn{color:var(--bad);background:var(--bad-l)}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.sec{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}
.sec h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
.sec .l{font-size:12.5px;color:var(--muted)}
.bl{display:grid;gap:12px;margin-top:6px}
.bl .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bl .b{height:8px;background:#eef0f4;border-radius:5px;overflow:hidden}.bl .b div{height:100%;background:var(--navy);border-radius:5px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.rk{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;background:#eef0f4}
.rk.t5{background:var(--gold-l);color:#7a5714}
.na{color:#b4b9c4}
footer{margin-top:26px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
/* ===== Added for the Rankings tab (same tokens; from the prototype's Rankings tab) ===== */
.r21{grid-template-columns:2fr 1fr}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tools input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px;font:inherit}
.sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.sw button{border:0;background:none;padding:6px 11px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}.sw button.on{background:var(--navy);color:#fff;font-weight:600}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
.scroll{max-height:460px;overflow:auto}
.tab.soon{color:#b4b9c4}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* ===== Phone (the approved mockup had no phone layout) ===== */
@media (max-width:760px){
 .hd{flex-direction:column;align-items:flex-start;gap:12px;padding:14px 16px}
 .ctl{flex-wrap:wrap}
 .tabs{padding:0 16px;overflow-x:auto}
 .wrap{padding:0 16px 32px}
 .r4{grid-template-columns:1fr 1fr}.r3,.r2,.r21{grid-template-columns:1fr}
 .big{font-size:28px}
 .ch{flex-wrap:wrap;gap:4px 8px;align-items:flex-start}
 .legend{flex-wrap:wrap;gap:4px 10px}
 .tools input{min-width:0;flex:1 1 100%}
 .card.tbl{overflow-x:auto}
 footer{flex-direction:column;gap:6px}
}
/* ===== v1.37.0 page parts the static preview didn't need (same tokens) ===== */
.pill.pdf{cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
.agency{display:none}
.agency.on{display:block;height:30px;width:auto;padding-left:12px;margin-left:2px;border-left:1px solid var(--line)}
.draft{background:var(--gold-l);color:#7a5714;border-bottom:1px solid #ecd9ae;font-size:12.5px;font-weight:600}
.draft div{max-width:1180px;margin:0 auto;padding:8px 24px}
.lock{max-width:440px;margin:40px auto;text-align:left}
.lock h2{font-size:18px;font-weight:800;margin-bottom:6px}.lock p{color:var(--muted);font-size:13px;margin-bottom:12px}
.lock form{display:flex;gap:8px;flex-wrap:wrap}
.lock input{flex:1 1 220px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
.lock button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.lock .err{color:var(--bad);font-size:12.5px;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.draft div{padding:8px 16px}}
@media print{.ctl,.tools,.draft{display:none}.scroll{max-height:none}}
</style></head><body>
<header>
 <div class="hd">
  <div class="brand"><svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 1 28 6v11c0 8-6 13.5-13 16C8 30.5 2 25 2 17V6z" fill="#1b2a4e"/><path d="M8 22l5-5 3 3 6-7" stroke="#f2c46b" stroke-width="2.2" fill="none"/><path d="M19 13h3v3" stroke="#f2c46b" stroke-width="2.2" fill="none"/></svg>
   <div><div class="t" id="firm">LeadPro Reports</div><div class="s" id="sub">LeadPro Reports</div></div><img class="agency" id="agency" alt="Web Promotion Partners" height="30"></div>
  <div class="ctl"><span class="pill"><b>Last 30 days</b> ▾</span><span class="pill">vs previous period ▾</span><button type="button" class="pill pdf" id="pdf">Download PDF</button></div>
 </div>
 <div class="tabs" id="tabs" role="tablist" aria-label="Report sections"></div>
</header>
<div class="draft" id="draft" hidden><div>Draft · your LFMP team is reviewing this page. It isn't in your GHL menu yet.</div></div>
<div class="wrap" id="body"><p class="note" style="margin-top:26px">Loading…</p></div>
<script type="module">
// v1.37.0 LeadPro Reports, Phase 1 (Rankings from BrightLocal). The approved client-report look ("Claude outputs/
// reports-preview/report.html"): same CSS, same header, Phase 1 shows only the Rankings tab. Loaded by the firm stub
// firms/<slug>/reports.html. Reads only this firm's files: ./reports-config.json (Draft / Live), ./data/kpis.json (name,
// brand) and ./reports.json (the numbers, encrypted with the firm's KPI passphrase; unlocked with the same passphrase as
// its KPI dashboard: the #k=… link key from GHL, or the one saved in this browser for this firm, or typed).
const PATH_FIRM = /\/firms\/([a-z0-9]+(?:-[a-z0-9]+)*)\/(?:reports\.html)?$/.exec(location.pathname);
const SLUG = PATH_FIRM ? PATH_FIRM[1] : (new URLSearchParams(location.search).get('firm') || '').toLowerCase();
const ROOT = location.pathname.replace(/(?:firms\/[^/]+|app)\/[^/]*$/, '');
const FIRM = PATH_FIRM ? './' : `${ROOT}firms/${SLUG}/`;
const { decryptJSON } = await import(`${ROOT}scripts/kpi-core.mjs`);
const PASS_KEY = `lfmp-pass-${SLUG}`;   // the same saved passphrase as this firm's KPI dashboard
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getJSON = async p => { const r = await fetch(`${FIRM}${p}?t=${Date.now()}`, { cache: 'no-store' }); if (r.status === 404) return null; if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); };

let cfg = null, kpis = null, file = null, R = null;
let S = { tab: 'Rankings', q: '', top: true, sort: 'vol' };
const TABS = ['Rankings'];   // Phase 1: the other tabs appear as each source is connected
const fmtDay = (iso, year = true) => { const d = new Date(`${iso}T12:00:00Z`); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}), timeZone: 'UTC' }); };
const fmtUpdated = iso => { const d = new Date(iso || ''); if (Number.isNaN(d.getTime())) return ''; return `${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'America/New_York' })}, ${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' })} ET`; };
const sign = n => (n > 0 ? `+${n}` : String(n));

const rk = v => v == null ? '<span class="na">–</span>' : `<span class="rk ${v <= 5 ? 't5' : ''}">${v}</span>`;
function line(series, labels, o) {
  const W = 620, H = 210, L = 34, Rr = 20, T = 12, B = 26, mn = o.min, mx = o.max, x = i => L + i * (W - L - Rr) / Math.max(labels.length - 1, 1), y = v => { let t = (v - mn) / (mx - mn); t = 1 - t; return T + (1 - t) * (H - T - B); };
  let g = '';
  o.ticks.forEach(v => g += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f4"/><text x="${L - 7}" y="${y(v) + 4}" font-size="10" fill="#6b7280" text-anchor="end">${v}</text>`);
  labels.forEach((l, i) => g += `<text x="${x(i)}" y="${H - 7}" font-size="10" fill="#6b7280" text-anchor="middle">${esc(l)}</text>`);
  series.forEach(s => { const pts = s.d.map((v, i) => (v == null ? null : [x(i), y(v), v, i])).filter(Boolean); g += `<polyline points="${pts.map(p => `${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.4"/>`; pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="${s.c}" stroke-width="2"><title>${esc(labels[p[3]])}: ${p[2]}</title></circle>`); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Average Google position by month">${g}</svg>`;
}
// the y-axis: the preview's 15–25 when the numbers fit, otherwise widened in 2.5 steps (inverted: lower = higher on the chart)
function axis(values) {
  const v = values.filter(n => n != null); if (!v.length) return { min: 15, max: 25, ticks: [15, 17.5, 20, 22.5, 25] };
  let min = Math.min(15, Math.floor(Math.min(...v) / 2.5) * 2.5), max = Math.max(25, Math.ceil(Math.max(...v) / 2.5) * 2.5);
  if (min < 1) min = 0; const step = (max - min) / 4;
  return { min, max, ticks: [0, 1, 2, 3, 4].map(i => Math.round((min + i * step) * 10) / 10) };
}
const bars = (list, c) => { const mx = Math.max(...list.map(x => x[1])) || 1; return `<div class="bl">${list.map(([k, v]) => `<div><div class="t"><span>${esc(k)}</span><b>${v}</b></div><div class="b"><div style="width:${Math.max(v / mx * 100, 1.5)}%;background:${c}"></div></div></div>`).join('')}</div>`; };
const kpi = (t, v, c, n) => `<div class="card"><div class="ch"><span class="ct">${t}</span><span class="src">BrightLocal</span></div><div><span class="big">${v}</span>${c || ''}</div><div class="note">${n}</div></div>`;
const footer = () => {
  const wpp = kpis?.agency === 'WPP' ? ' · Web Promotion Partners' : '';
  const when = fmtUpdated(file?.generatedAt);
  return `<footer><span>LeadPro Reports · Data refreshed nightly${when ? ` · Last updated ${esc(when)}` : ''}${wpp}</span><span>Questions? Contact your Client Success Manager.</span></footer>`;
};

function head() {
  const name = kpis?.location || cfg?.firmName || 'LeadPro Reports';
  $('firm').textContent = name; document.title = `${name} · LeadPro Reports`;
  $('sub').textContent = `LeadPro Reports${R?.location?.city ? ` · ${R.location.city}` : ''}`;
  const ag = $('agency');
  if (kpis?.agency === 'WPP') { ag.src = `${ROOT}brand/wpp-logo.png?v=1.34.0`; ag.classList.add('on'); }   // the real WPP logo (KPI v1.34.0); this page is light only
  $('draft').hidden = !cfg?.enabled || cfg.status === 'live';
  $('tabs').innerHTML = TABS.map(t => `<span class="tab ${t === S.tab ? 'on' : ''}" role="tab" aria-selected="${t === S.tab}" data-t="${esc(t)}" style="cursor:pointer">${esc(t)}</span>`).join('');
}
function lockHtml(err = '') {
  return `<div class="card lock"><h2>Enter the passphrase</h2><p>This report is private. Use the same passphrase as your KPI dashboard (your LFMP team has it). It's remembered in this browser.</p>
  <form id="unlock"><label class="sr" for="pass">Passphrase</label><input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" required><button type="submit">Unlock</button></form>${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}</div>${footer()}`;
}
function emptyHtml(title, text) { return `<div class="sec"><div><h2>Google rankings</h2></div></div><div class="card"><div class="empty"><b>${esc(title)}</b>${esc(text)}</div></div>${footer()}`; }

function draw() {
  head();
  if (!cfg?.enabled) { $('body').innerHTML = emptyHtml('Not set up yet', 'Your LFMP team hasn\'t set up this report yet.'); return; }
  if (!file) { $('body').innerHTML = emptyHtml('First report coming soon', 'Your rankings appear here after the first nightly update.'); return; }
  if (!R) return;
  const sm = R.summary, rep = R.report, N = sm.tracked;
  let h = '';
  const vs = rep.prevRunAt ? ` vs ${fmtDay(rep.prevRunAt, false)}` : '';
  h += `<div class="sec"><div><h2>Google rankings</h2><div class="l">BrightLocal Rank Tracker · ${esc(fmtDay(rep.runAt))}${esc(vs)}${rep.checkedFrom ? ` · checked from ${esc(rep.checkedFrom)}` : ''}. Lower number = higher on the page. Rankings update after each BrightLocal run, not with the date picker.</div></div></div>`;
  const ch = sm.avgChange == null || sm.avgChange === 0 ? '' : sm.avgChange > 0 ? `<span class="chg dn">▼ ${Math.abs(sm.avgChange)}</span>` : `<span class="chg up">▲ ${Math.abs(sm.avgChange)}</span>`;
  h += `<div class="row r4">${kpi('Average Google position', sm.avg ?? '–', ch, `Across ${N} tracked keywords`)}${kpi('Keywords in the top 20', sm.top20, '', `of ${N} tracked, any search`)}${kpi('Movement', `${sign(sm.movement.keyword)} / ${sign(sm.movement.positional)}`, '', 'keyword / positional change')}${kpi('Google map 3-pack', `${sm.mapPack}%`, '', sm.mapPack ? 'of keywords show you in the map 3-pack' : 'Not in the map results yet')}</div>`;
  const H = R.history, ax = axis([...H.desktop, ...H.mobile, ...H.localFinder]);
  h += `<div class="row r21"><div class="card"><div class="ch"><span class="ct">Average position by month (higher on the chart = better)</span><div class="legend"><span><i style="background:#1b2a4e"></i>Desktop</span><span><i style="background:#b8862b"></i>Mobile</span><span><i style="background:#4a78c2"></i>Local Finder</span></div></div>${H.months.length ? line([{ d: H.localFinder, c: '#4a78c2' }, { d: H.mobile, c: '#b8862b' }, { d: H.desktop, c: '#1b2a4e' }], H.months, ax) : '<div class="empty">The monthly trend appears after the first runs.</div>'}</div>
  <div class="card"><div class="ch"><span class="ct">Positions mix (desktop)</span></div>${bars(R.mix.bands, '#b8862b')}<div class="note">Rankings past page 1 can shift from day to day; watch the trend.</div></div></div>`;
  let rows = R.keywords.map(k => ({ ...k, v: k.vol === '<10' ? 5 : Number(String(k.vol).replace(/[^0-9.]/g, '')) || 0 }));
  if (S.top) rows = rows.filter(r => r.d || r.m || r.l);
  if (S.q) rows = rows.filter(r => r.k.toLowerCase().includes(S.q.toLowerCase()));
  const key = S.sort; rows.sort((a, b) => key === 'vol' ? b.v - a.v : key === 'kw' ? a.k.localeCompare(b.k) : ((a[key] ?? 99) - (b[key] ?? 99)));
  h += `<div class="card tbl"><div class="tools"><input id="q" placeholder="Search keywords…" aria-label="Search keywords" value="${esc(S.q)}"><div class="sw"><button type="button" data-top="1" class="${S.top ? 'on' : ''}">In top 20 (${sm.top20})</button><button type="button" data-top="0" class="${!S.top ? 'on' : ''}">All ${N}</button></div><span class="note" style="margin:0">Click a column to sort · "–" = not in the top 20</span></div>
  <div class="scroll"><table><tr><th class="s" data-s="kw">Keyword</th><th class="s" data-s="vol">Monthly searches</th><th class="s" data-s="d">Desktop</th><th class="s" data-s="m">Mobile</th><th class="s" data-s="l">Maps</th><th>Change</th></tr>
  ${rows.map(r => `<tr><td>${esc(r.k)}</td><td>${esc(r.vol)}</td><td>${rk(r.d)}</td><td>${rk(r.m)}</td><td>${rk(r.l)}</td><td>${r.change > 0 ? `<b style="color:#1f9d55">▲ ${r.change}</b>` : r.change < 0 ? `<b style="color:#d64545">▼ ${-r.change}</b>` : '<span class="na">–</span>'}</td></tr>`).join('') || '<tr><td colspan="6" class="na">No keywords match.</td></tr>'}</table></div></div>`;
  if (R.competitors?.names?.length && R.competitors.rows?.length) {
    h += `<div class="sec"><div><h2>You vs. competitors</h2><div class="l">Desktop Google ranks, ${esc(fmtDay(rep.runAt, false))} run.</div></div></div>
  <div class="card tbl"><table><tr><th>Keyword</th><th>You</th>${R.competitors.names.map(n => `<th>${esc(n)}</th>`).join('')}</tr>${R.competitors.rows.map(c => `<tr><td>${esc(c[0])}</td>${c.slice(1).map(v => `<td>${rk(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  h += footer();
  $('body').innerHTML = h;
  const q = $('q'); if (q) q.oninput = e => { S.q = e.target.value; draw(); const n = $('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}
async function unlock(pass) { R = await decryptJSON(file.enc, pass); store.set(PASS_KEY, pass); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t) { S.tab = t.dataset.t; draw(); return; }
  const tp = e.target.closest('[data-top]'); if (tp) { S.top = tp.dataset.top === '1'; draw(); return; }
  const so = e.target.closest('[data-s]'); if (so && R) { S.sort = so.dataset.s; draw(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'unlock') return; e.preventDefault();
  const pass = $('pass').value;
  try { await unlock(pass); draw(); } catch { $('body').innerHTML = lockHtml('That passphrase didn\'t open this report. Check it and try again.'); $('pass').focus(); }
});
$('pdf').addEventListener('click', () => window.print());
(async () => {
  try {
    [cfg, kpis, file] = await Promise.all([getJSON('reports-config.json'), getJSON('data/kpis.json').catch(() => null), getJSON('reports.json')]);
    const m = /(?:^|[#&])k=([^&]+)/.exec(location.hash || '');
    if (m) { store.set(PASS_KEY, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
    const pass = store.get(PASS_KEY);
    if (file && pass) { try { await unlock(pass); } catch { store.set(PASS_KEY, null); } }
    if (file && !R && cfg?.enabled) { head(); $('body').innerHTML = lockHtml(); return; }
    draw();
  } catch (e) { head(); $('body').innerHTML = `<div class="card" style="margin-top:26px"><div class="empty"><b>Couldn't load the report</b>${esc(e.message)}. Please refresh.</div></div>`; }
})();
</script></body></html>
