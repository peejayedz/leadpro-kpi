name: Add a scorecard to its GHL menu (from the builder)
# v1.28.0. Every new scorecard starts as a Draft: new-firm.yml no longer adds the GHL menu link. After Andy's review,
# the Builder's KPI tab "Add to GHL menu" (asks first) starts this: ONLY the existing menu-link step (scripts/ghl-menu.mjs,
# the same guarded POST as before: "KPI Dashboard", this one sub-account, new tab), then the firm goes live (its Draft
# status is removed from firms/index.json). Refuses a firm that isn't a Draft.
# PUBLIC LOGS: step names, slugs, results and GHL's reason for a refusal (links and the passphrase cut out). The link holds
# the dashboard passphrase: never printed.
run-name: "Menu link ${{ inputs.slug }} [${{ inputs.request }}]"

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Firm slug (a Draft)"
        required: true
      request:
        description: "Builder request id (to find this run)"
        required: true
      # v1.37.0 LeadPro Reports: "reports" = add the client's "Reports" link (a Draft report goes Live); "reports-remove" =
      # remove that link and the report's files (scripts/reports-menu.mjs). Empty / "kpi" = the KPI steps, unchanged.
      kind:
        description: "kpi (default) · reports · reports-remove · pass"
        required: false
        default: "kpi"

permissions:
  contents: write

concurrency:
  group: new-firm
  cancel-in-progress: false

env:
  NF_SLUG: ${{ inputs.slug }}
  NF_REQUEST: ${{ inputs.request }}
  NF_KIND: ${{ inputs.kind || 'kpi' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.plan.outputs.key }}
      location: ${{ steps.plan.outputs.location }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Check the firm is a Draft
        id: plan
        run: |
          if [ "$NF_KIND" = "kpi" ]; then node scripts/new-firm.mjs menu-plan
          elif [ "$NF_KIND" = "reports" ] || [ "$NF_KIND" = "reports-remove" ]; then node scripts/reports-menu.mjs plan
          elif [ "$NF_KIND" = "pass" ]; then node scripts/pass-rotate.mjs plan
          else echo "Refused: unknown kind \"$NF_KIND\""; exit 1; fi

  menu-link:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: GHL menu link
        if: env.NF_KIND == 'kpi'
        env:
          GHL_MENU_TOKEN: ${{ secrets.GHL_MENU_TOKEN }}
          NF_PASSPHRASE: ${{ secrets[format('PASSPHRASE_{0}', needs.prepare.outputs.key)] }}
          NF_LOCATION: ${{ needs.prepare.outputs.location }}
        run: node scripts/new-firm.mjs menu
      - name: Go live
        if: env.NF_KIND == 'kpi'
        run: |
          node scripts/new-firm.mjs go-live
          git config user.name "kpi-sync-bot"
          git config user.email "kpi-sync-bot@users.noreply.github.com"
          git add "firms/$NF_SLUG/config.json" firms/index.json "status/menu-link-$NF_SLUG.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Menu link for $NF_SLUG: live"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
      # v1.37.0 LeadPro Reports: the "Reports" link (scripts/reports-menu.mjs; the same guarded GHL calls as KPI Dashboard)
      - name: Reports link
        if: env.NF_KIND == 'reports' || env.NF_KIND == 'reports-remove'
        env:
          GHL_MENU_TOKEN: ${{ secrets.GHL_MENU_TOKEN }}
          NF_PASSPHRASE: ${{ secrets[format('PASSPHRASE_{0}', needs.prepare.outputs.key)] }}
          NF_LOCATION: ${{ needs.prepare.outputs.location }}
        run: |
          if [ "$NF_KIND" = "reports" ]; then node scripts/reports-menu.mjs menu && node scripts/reports-menu.mjs go-live
          else node scripts/reports-menu.mjs remove; fi
          git config user.name "kpi-sync-bot"
          git config user.email "kpi-sync-bot@users.noreply.github.com"
          git add -A "firms/$NF_SLUG/reports-config.json" "firms/$NF_SLUG/reports.json" "firms/$NF_SLUG/reports.html" "status/menu-link-$NF_SLUG-reports.json" 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reports link for $NF_SLUG: $([ "$NF_KIND" = reports ] && echo live || echo removed)"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
      # v1.44.0 (queue item 15): Change passphrase: the firm's own KPI Dashboard / Reports links get the new passphrase in
      # their URL (same ids, same settings; scripts/pass-rotate.mjs menu). PASSPHRASE_<KEY> is already the new one.
      - name: Passphrase in the menu links
        if: env.NF_KIND == 'pass'
        env:
          GHL_MENU_TOKEN: ${{ secrets.GHL_MENU_TOKEN }}
          NF_PASSPHRASE: ${{ secrets[format('PASSPHRASE_{0}', needs.prepare.outputs.key)] }}
          NF_LOCATION: ${{ needs.prepare.outputs.location }}
        run: |
          node scripts/pass-rotate.mjs menu || rc=$?
          git config user.name "kpi-sync-bot"
          git config user.email "kpi-sync-bot@users.noreply.github.com"
          git add "status/menu-link-$NF_SLUG-pass.json" 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "Menu links for $NF_SLUG: passphrase updated"; for i in 1 2 3; do git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((i * 5)); done; fi
          exit ${rc:-0}
      # v1.32.1: when the link isn't added, keep GHL's reason (status/menu-link-<slug>.json: slug, request id, time, result
      # code and the plain-words reason; no link, no passphrase) so KPI admin / the Builder can show it in the popup.
      - name: Save why the link wasn't added
        if: failure()
        run: |
          f="status/menu-link-$NF_SLUG.json"
          [ "$NF_KIND" = "kpi" ] || f="status/menu-link-$NF_SLUG-reports.json"
          [ -f "$f" ] || exit 0
          git config user.name "kpi-sync-bot"
          git config user.email "kpi-sync-bot@users.noreply.github.com"
          git reset --quiet
          git add "$f"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Menu link for $NF_SLUG: not added (reason saved)"
          git stash --include-untracked --quiet || true
          for i in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
