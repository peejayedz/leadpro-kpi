name: Sync KPIs from GoHighLevel
# The admin page finds the run it started by this title.
# Chained runs (see sync-chain.yml) end in " (chain)".
run-name: "Sync ${{ inputs.slug || 'all firms' }}${{ inputs.chain == 'yes' && ' (chain)' || '' }}"

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes (UTC); GitHub skips some, so sync-chain.yml backs it up
  workflow_dispatch: # Run workflow button, the admin page's Re-sync, and the sync chain
    inputs:
      slug:
        description: "Firm slug (e.g. mahdavi). Leave empty to sync every firm."
        required: false
        default: ""
      chain:
        description: "Leave empty. Set to yes only by the sync chain."
        required: false
        default: ""

permissions:
  contents: write # lets the built-in GITHUB_TOKEN commit the data files

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  # 1. Which firms: firms/index.json, or the one slug input.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      problems: ${{ steps.plan.outputs.problems }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - id: plan
        env:
          SLUG: ${{ inputs.slug }}
        run: node scripts/plan-matrix.mjs "$SLUG"

  # 2. One job per firm. Each job sees only its own firm's two secrets. A failing firm never
  #    stops the others; its job writes a result file (category only, no error text) that the
  #    commit job turns into status/sync-status.json for the admin page's notifications.
  sync:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one firm failing never stops the others
      max-parallel: 5
      matrix:
        firm: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The firm's name in the job title, so GitHub's failure emails and run pages say which firm.
    name: "Sync · ${{ matrix.firm.name || matrix.firm.slug }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Pull GHL and compute KPIs
        env:
          SLUG: ${{ matrix.firm.slug }}
          SYNC_RESULT_FILE: ${{ runner.temp }}/result/${{ matrix.firm.slug }}.json
          GHL_TOKEN: ${{ secrets[format('GHL_TOKEN_{0}', matrix.firm.secretKey)] }}
          DASHBOARD_PASSPHRASE: ${{ secrets[format('PASSPHRASE_{0}', matrix.firm.secretKey)] }}
        run: node scripts/sync.mjs "$SLUG"
      # The artifact holds <slug>/kpis.json etc., so the commit job can tell firms apart
      # whatever folder layout download-artifact uses.
      - name: Stage data for upload
        env:
          SLUG: ${{ matrix.firm.slug }}
        run: mkdir -p "$RUNNER_TEMP/out/$SLUG" && cp -R "firms/$SLUG/data/." "$RUNNER_TEMP/out/$SLUG/"
      - uses: actions/upload-artifact@v7
        with:
          name: firm-${{ matrix.firm.slug }}
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error
      # Always, so a failed firm still reports why (the category only; see scripts/sync-status.mjs).
      - name: Upload sync result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.firm.slug }}
          path: ${{ runner.temp }}/result/
          retention-days: 1
          if-no-files-found: warn

  # 3. One commit with every firm that synced, plus the updated status/sync-status.json.
  commit:
    needs: [plan, sync]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The LATEST main, not the commit the run started from: a sync that waited in the queue (e.g. a Re-sync or a
      # new firm's first sync started during a chain sync) would otherwise build status/sync-status.json on an old
      # copy and its push would conflict (seen 2026-11-12 Hedayati Re-sync, 2026-11-13 zz-test-2 first sync).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/download-artifact@v8
        with:
          pattern: firm-*
          path: ${{ runner.temp }}/firms
      - name: Download sync results
        continue-on-error: true # a run where every firm job crashed leaves none
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Copy firm data
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          SYNC_RESULT: ${{ needs.sync.result }}
          DL: ${{ runner.temp }}/firms
        run: |
          missing=0
          for slug in $(echo "$MATRIX" | jq -r '.[].slug'); do
            # One artifact downloads flat into $DL; several download into $DL/firm-<slug>/.
            src=""
            for d in "$DL/firm-$slug/$slug" "$DL/$slug"; do [ -f "$d/kpis.json" ] && { src="$d"; break; }; done
            if [ -n "$src" ]; then
              rm -rf "firms/$slug/data"
              mkdir -p "firms/$slug/data"
              cp -R "$src/." "firms/$slug/data/"
              echo "✓ $slug"
            else
              missing=$((missing + 1))
              echo "✗ $slug (no data: its sync job failed)"
            fi
          done
          # Every sync job passed but data is missing: a workflow bug, never a silent success.
          if [ "$SYNC_RESULT" = "success" ] && [ "$missing" -gt 0 ]; then
            echo "::error::$missing firm(s) synced but their data was not found in the artifacts"
            find "$DL" -maxdepth 3 | head -50
            exit 1
          fi
      - name: Update sync status
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          PLAN_PROBLEMS: ${{ needs.plan.outputs.problems }}
          RESULTS_DIR: ${{ runner.temp }}/results
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          CHAINED: ${{ inputs.chain }}
          SYNC_CHAIN: ${{ vars.SYNC_CHAIN }}
        run: node scripts/update-status.mjs
      - name: Commit if changed
        env:
          SLUG: ${{ inputs.slug }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          git config user.name "kpi-sync-bot"
          git config user.email "kpi-sync-bot@users.noreply.github.com"
          git add -A firms status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          synced=$(git diff --cached --name-only -- 'firms/*/data/kpis.json' | wc -l | tr -d ' ')
          if [ -n "$SLUG" ]; then label="$SLUG"; else label="$synced firm$([ "$synced" = 1 ] || echo s)"; fi
          git commit -m "Sync $label $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          echo "Push failed after 3 tries" >&2
          exit 1

  # 4. Scheduled and chained runs start the next link of the sync chain (sync-chain.yml), which
  #    waits for the next :07/:37 slot in its own concurrency group, so this run ends now and
  #    never blocks an admin Re-sync. Admin and manual runs don't chain. SYNC_CHAIN=off stops it.
  chain:
    needs: commit
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.chain == 'yes') && vars.SYNC_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the sync chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-chain.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
