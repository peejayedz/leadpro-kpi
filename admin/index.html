function ghError(status, msg, path) {
  if (status === 401) return "GitHub rejected the team site's GitHub token (expired or revoked). Tell PJ: it's renewed in Cloudflare (lfmp-admin → Variables and Secrets → GITHUB_TOKEN).";
  if (status === 403 && /rate limit/i.test(msg)) return 'GitHub rate limit reached. Wait a few minutes and try again.';
  if (status === 403 || (status === 404 && path.startsWith(R))) return `The team site's GitHub token can't do this (${msg || status}). It needs repository "${REPO}" with Contents, Actions and Secrets set to Read and write. Tell PJ.`;
  return `GitHub ${status}: ${msg || 'request failed'}`;
}
async function gh(method, path, body, { allow404 = false } = {}) {
  let r;
  try { r = await ghFetch(method, path, body); }
  catch (e) { if (e instanceof ApiError && e.status !== 401) { const x = new Error(e.message); x.status = e.status; x.code = e.code; throw x; } throw e; }
  if (r.status === 404 && allow404) return null;
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch {} const e = new Error(ghError(r.status, m, path)); e.status = r.status; throw e; }
  const text = r.status === 204 ? '' : await r.text();     // some successes (e.g. secret created) have an empty body
  return text ? JSON.parse(text) : {};
}

// One commit through the Git Data API. build(headSha, treeSha) returns [{ path, content } | { path, delete: true }].
// Retries on a race with the sync bot (ref moved), re-running build on the new head.
async function commitFiles(message, build) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const head = (await gh('GET', `${R}/git/ref/heads/${BRANCH}`)).object.sha;
    const base = await gh('GET', `${R}/git/commits/${head}`);
    const changes = await build(head, base.tree.sha);
    if (!changes.length) return null;
    const tree = [];
    for (const ch of changes) {
      if (ch.delete) { tree.push({ path: ch.path, mode: '100644', type: 'blob', sha: null }); continue; }
      const blob = await gh('POST', `${R}/git/blobs`, { content: ch.content, encoding: 'utf-8' });
      tree.push({ path: ch.path, mode: '100644', type: 'blob', sha: blob.sha });
    }
    const t = await gh('POST', `${R}/git/trees`, { base_tree: base.tree.sha, tree });
    const c = await gh('POST', `${R}/git/commits`, { message, tree: t.sha, parents: [head] });
    try { await gh('PATCH', `${R}/git/refs/heads/${BRANCH}`, { sha: c.sha, force: false }); return c.sha; }
    catch (e) { if (e.status === 422 && attempt < 3) { await sleep(1500); continue; } throw e; }
  }
}
async function listFolder(treeSha, prefix) {
  const t = await gh('GET', `${R}/git/trees/${treeSha}?recursive=1`);
  return t.tree.filter(x => x.type === 'blob' && x.path.startsWith(prefix)).map(x => x.path);
}

// ---------- secrets (sealed with the repo's public key via libsodium) ----------
let sodiumP = null;
function loadSodium() {
  return sodiumP ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = SODIUM.src; s.integrity = SODIUM.integrity; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
    s.onload = async () => { const so = window.sodium; if (!so?.crypto_box_seal) { sodiumP = null; return reject(new Error('The encryption library loaded but is not usable.')); } if (so.ready) await so.ready; resolve(so); };
    s.onerror = () => { sodiumP = null; s.remove(); reject(new Error("Couldn't load the encryption library from cdnjs. Check your connection and retry.")); };
    document.head.appendChild(s);
  });
}
async function putSecret(name, value) {

// Starts a workflow and follows the run it created (matched by its run-name title).
async function dispatch(workflow, inputs) {

// Polls until check() returns a value. Fails fast if the run fails. limitMs counts from when the run starts.
// Errors whose message is our own HTML (run links) carry .html = true; everything else is escaped.
const htmlError = msg => Object.assign(new Error(msg), { html: true });

const kpiJob = o => startJob({ tool: 'kpi', ...o, check: o.check ? { repo: `${OWNER}/${REPO}`, ...o.check } : undefined });

async function follow({ workflow, title, t0, check, limitMs, say, label, stop = () => false }) {
  let run = null, startedAt = null;
  const hardStop = t0 + Math.max(limitMs, 10 * 60e3);
  for (;;) {
    if (stop()) throw new Error('Stopped because you left this page.');
    await sleep(4000);
    if (!run || run.status !== 'completed') {
      run = (await findRun(workflow, title, t0)) || run;
      if (run) run = await gh('GET', `${R}/actions/runs/${run.id}`);
    }
    const link = run ? ` · <a href="${esc(run.html_url)}" target="_blank" rel="noopener">view run</a>` : '';
    const state = !run ? 'starting' : run.status === 'completed' ? run.conclusion : run.status;
    if (run && run.status === 'in_progress' && !startedAt) startedAt = Date.now();
    void state;   // v1.31.0: never shown (no raw "in_progress" / "queued"); the working bar shows the progress
    say(`${esc(label)}…${link}`);
    if (run?.status === 'completed' && run.conclusion !== 'success') throw htmlError(`GitHub stopped it before it finished${run.conclusion === 'cancelled' ? ' (it was cancelled)' : ''}.${run.html_url ? ` <a href="${esc(run.html_url)}" target="_blank" rel="noopener">View run</a>` : ''}`);
    const got = await check();
    if (got) return { value: got, run };
    if (run?.status === 'completed' && Date.now() - Date.parse(run.updated_at) > 60e3) throw htmlError(`GitHub finished, but the result didn't arrive. <a href="${esc(run.html_url)}" target="_blank" rel="noopener">View run</a>`);
    const now = Date.now();
    if ((startedAt && now - startedAt > limitMs) || (!startedAt && !run && now - t0 > 90e3) || now > hardStop)
      throw htmlError(`${run ? 'It took too long' : 'GitHub didn\'t start it'} (${Math.max(1, Math.round((now - t0) / 60e3))} min).${run ? ` <a href="${esc(run.html_url)}" target="_blank" rel="noopener">View run</a>` : ''}`);
  }
}

// Re-sync one firm. Progress shows on its row and in its Details panel; it keeps going if you switch screens.
async function resyncFirm(f) {
  const key = `${f.slug}:sync`; if (busy.has(key)) return;
  busy.add(key); repaintFirm(f.slug);
  const say = h => firmSay(f.slug, h);
  say('<span class="chip">Re-syncing</span> Fetching the latest numbers from GHL…');
  const name = fname(f);
  const job = kpiJob({ kind: 'sync', client: name, what: 'Sync now', title: `Syncing ${name} with GHL…`, host: `firm:${f.slug}`, typicalMs: 150000,
    check: { workflow: 'sync.yml', title: `Sync ${f.slug}` }, doneText: { title: 'Done: synced', lead: `${name}'s dashboard has the latest numbers.` } });
  try {
    const t0 = await dispatch('sync.yml', { slug: f.slug });
    const before = kpis[f.slug]?.generatedAt || '';
    const { value } = await follow({ workflow: 'sync.yml', title: `Sync ${f.slug}`, t0, label: 'Syncing', limitMs: 8 * 60e3, say: () => say('<span class="chip">Re-syncing</span> Fetching the latest numbers from GHL…'), stop: () => !me,
      // a held sync leaves generatedAt alone and only updates sync.checkedAt
      check: async () => { const k = await getJSON(`firms/${f.slug}/data/kpis.json`); return (k?.generatedAt && k.generatedAt !== before && Date.parse(k.generatedAt) > t0 - 60e3) || Date.parse(k?.sync?.checkedAt) > t0 - 60e3 ? k : null; } });
    kpis[f.slug] = kpiSummary(value); kpiFull[f.slug] = value;
    const held = value.generatedAt === before;
    say(held ? `<span class="chip warn">Held</span> GHL returned fewer calls or messages than last sync, so the dashboard keeps the numbers from ${esc(fmtTime(value.generatedAt))}.` : `<span class="chip good">Synced</span> ${esc(fmtTime(value.generatedAt))}. The dashboard shows it within a minute.`);
    const n = leads90(value);
    job.done(held ? { title: 'Done: numbers held', lead: `GHL returned fewer calls or messages than last time, so ${name}'s dashboard keeps the numbers from ${fmtTime(value.generatedAt)}. The next sync tries again.`, line: 'Sync held', detail: 'last numbers kept' }
      : { title: 'Done: synced', lead: `${name}'s dashboard shows the new numbers within a minute.`, line: n != null ? `Synced · ${n} leads` : 'Synced', items: [...(n != null ? [['Leads (last 90 days)', String(n)]] : []), ['Synced', fmtTime(value.generatedAt)]] });
  } catch (e) {
    say(`<span class="chip bad">Sync failed</span> ${errHtml(e)}`);
    job.fail({ reason: errText(e), nothingChanged: 'the dashboard keeps its last numbers.', line: 'Sync didn\'t finish', onRetry: () => resyncFirm(f) });
  }
  finally { busy.delete(key); repaintFirm(f.slug); refreshIssues(); }
}
async function runKeeperFor(f, b) {
  if (b) b.disabled = true;
  try { await dispatch('tokens.yml', f ? { slug: f.slug } : {}); firmSay(f.slug, `<span class="chip good">Started</span> The token keeper is running for ${esc(f.name)} (about a minute). This updates on the next check.`); setTimeout(() => refreshIssues(), 90e3); }
  catch (err) { firmSay(f.slug, `<span class="chip bad">Couldn't start</span> ${esc(err.message)}`); if (b) b.disabled = false; }
}

async function toggleBanner(f) {
  const key = `${f.slug}:banner`; if (busy.has(key)) return;
  busy.add(key); repaintFirm(f.slug); firmSay(f.slug, 'Saving the banner setting…');
  try {
    let next, nowOn;
    await commitFiles(`${bannerOn(configs[f.slug], bases[f.slug] || shared.defaults) ? 'Hide' : 'Show'} testing banner for ${f.name}`, async head => {
      const cfg = await getJSON(`firms/${f.slug}/config.json`, head);
      if (!cfg) throw new Error('config.json not found');
      await loadShared(head);
      const base = await baseFor(cfg, head);
      nowOn = !bannerOn(cfg, base);
      // Only the firm's own override is written; it's dropped again when it matches the default.
      cfg.notice = { ...(cfg.notice || {}), show: nowOn };
      if (nowOn === (base.notice?.show !== false)) delete cfg.notice.show;
      if (!Object.keys(cfg.notice).length) delete cfg.notice;
      bases[f.slug] = base; next = cfg;
      return [{ path: `firms/${f.slug}/config.json`, content: jsonText(cfg) }];
    });
    configs[f.slug] = next;
    firmSay(f.slug, `<span class="chip good">Saved</span> Banner ${nowOn ? 'on' : 'off'}. The dashboard updates within a minute or two.`);
  } catch (e) { firmSay(f.slug, `<span class="chip bad">Not saved</span> ${esc(e.message)}`); }
  finally { busy.delete(key); repaintFirm(f.slug); }
}

          check: async () => { const list = await getJSON('firms/index.json'); const row = (list || []).find(x => x.slug === f.slug); return row && !row.status ? row : null; } });
        delete f.status;
        configs[f.slug] = (await getJSON(`firms/${f.slug}/config.json`).catch(() => null)) || configs[f.slug];   // v1.30.0: the link id → CSS rule

          items: [['Opens', 'inside GHL'], ['Menu order', hasId ? 'CSS rule ready to copy' : 'Show CSS rule in Setup']],

async function deleteFirm(slug, secretKey, name) {
  if (!slug || RESERVED.includes(slug) || slugify(slug) !== slug) throw new Error('Refusing to delete an invalid folder name.');
  await commitFiles(`Delete ${name || slug}`, async (head, tree) => {
    const files = await listFolder(tree, `firms/${slug}/`);
    const index = (await getJSON('firms/index.json', head)) || [];
    const kept = index.filter(x => x.slug !== slug);
    const ch = files.map(path => ({ path, delete: true }));
    if (kept.length !== index.length) ch.push({ path: 'firms/index.json', content: jsonText(kept) });
    return ch;
  });
  await deleteSecret(`GHL_TOKEN_${secretKey}`);
  await deleteSecret(`PASSPHRASE_${secretKey}`);
}

// =====================================================================
// Sync issues: the notification bell
// Reads status/sync-status.json (written by the sync workflow, see scripts/sync-status.mjs),
// the firms' kpis.json, the SYNC_CHAIN variable and the chain's runs; re-checks every 5 minutes.
// "Mark as seen" and the chain-stopped history are kept in this browser only.
// =====================================================================
const CHECK_MS = 5 * 60e3;
const BASE_TITLE = document.title;
const SEEN_KEY = 'leadpro-admin-seen', LIVE_KEY = 'leadpro-admin-live', LOCAL_RESOLVED = 'leadpro-admin-resolved';
let syncStatus = null, keeperStatus = null, removedLog = null, issues = [], issuesRead = false, chainInfo = {}, lastCheck = 0, checkErr = null, checkTimer = null, checking = null;
const subNames = {}, expanded = new Set(), issueMsg = {};
const readStore = (k, d) => { try { return JSON.parse(store.get(k)) ?? d; } catch { return d; } };
const seenSet = () => new Set(readStore(SEEN_KEY, []));
function markSeen(list) { const s = seenSet(); for (const i of list) s.add(seenKey(i)); store.set(SEEN_KEY, JSON.stringify([...s].slice(-300))); }
const listed = () => issues.filter(inBadge);   // holds are notices: shown, never counted
const unseen = () => { const s = seenSet(); return listed().filter(i => !s.has(seenKey(i))); };
const when = iso => (iso ? `${fmtTime(iso)} (${ago(iso)})` : 'unknown');
const firmOf = slug => firms.find(f => f.slug === slug);
const locOf = f => configs[f.slug]?.locationId || f.locationId || '';
const issueText = i => { const f = i.slug ? firmOf(i.slug) : null; return describeIssue(i, { now: Date.now(), subAccount: f ? subNames[f.slug] : null, secretKey: f?.secretKey, tokenSource: f?.tokenSource, lastGood: f ? kpis[f.slug]?.generatedAt : null, when, care: f ? careOf(f) : undefined }); };

// SYNC_CHAIN and whether a link of the chain is waiting (or a chained sync is running).
// v1.29.1: greet-count.mjs readChain (the greeting's count reads it the same way)
const chainState = () => GC.readChain(gh, R, syncStatus);
async function refreshIssues({ reloadKpis = false } = {}) {
  if (checking) return checking;
  checking = (async () => {
    try {
      if (reloadKpis) await Promise.all(firms.map(async f => { try { const k = await getJSON(`firms/${f.slug}/data/kpis.json`); kpis[f.slug] = k ? kpiSummary(k) : null; kpiFull[f.slug] = k; } catch {} }));
      syncStatus = await getJSON('status/sync-status.json').catch(() => null);
      chainInfo = await chainState();
      keeperStatus = await getJSON('status/token-keeper.json').catch(() => null);
      removedLog = await getJSON('status/removed.json').catch(() => null);   // v1.28.0: "Scorecard removed" notices (7 days)
      issues = GC.buildIssues({ keeperStatus, syncStatus, chain: chainInfo, firms, configs, kpis, now: Date.now() });   // v1.29.1: greet-count.mjs
      trackLive(); lastCheck = Date.now(); checkErr = null;
    } catch (e) { checkErr = e.message; }
    finally { checking = null; issuesRead = true; }
    if (!me) return;
    paintBell(); paintRows(); paintStrip(); paintSyncInfo(); if (!$('nPanel').hidden) paintPanel();
  })();
  return checking;
}
// "Chain stopped" is only seen live, so this browser keeps its history for "Recently resolved".
function trackLive() {
  const was = readStore(LIVE_KEY, []), now = issues.filter(i => i.kind === 'no-link').map(i => ({ id: i.id, slug: null, kind: i.kind, firstSeen: i.firstSeen, lastSeen: i.lastSeen, count: 0 }));
  const gone = was.filter(w => !now.some(n => n.id === w.id));
  if (gone.length) store.set(LOCAL_RESOLVED, JSON.stringify([...gone.map(g => ({ ...g, resolvedAt: new Date().toISOString() })), ...readStore(LOCAL_RESOLVED, [])].slice(0, 20)));
  store.set(LIVE_KEY, JSON.stringify(now));
}
// v2: the shell draws the bell (desktop top bar + phone top bar); its red count = new issues, as before.

}

}

// Decrypts the firm's details.enc.json (same file the client dashboard opens) with, in order: a passphrase typed here,
// one remembered for the team (the team site's server, /api/kpi-pass), or the one the client dashboard saved on this device.
// Shows names and links only; the list itself is never saved or sent anywhere.
async function loadNip(f, typed, remember = false) {
  const r = reasonsOf(f).find(x => x.kind === 'not-in-pipeline'); if (!r) return;
  const s = nip[f.slug];
  const repaint = () => { const el = $('nipList'); if (el && dpSlug === f.slug) { el.innerHTML = nipHtml(f); wireEyes(el); } };
  if (!typed && (s?.state === 'ok' || s?.state === 'loading' || s?.state === 'error')) { repaint(); return; }
  nip[f.slug] = { state: 'loading' };
  let mine = null;
  if (!typed) { try { mine = await rememberedPass(f.slug); } catch {} }
  const pass = typed || mine || savedPass(f.slug);
  if (!pass) { delete nip[f.slug]; repaint(); return; }
  repaint();
  try {
    let env = null;
    try { const res = await fetch(`${DATA_ROOT}firms/${encodeURIComponent(f.slug)}/data/details.enc.json?t=${Date.now()}`, { cache: 'no-store' }); if (res.ok) env = await res.json(); } catch {}
    if (!env) env = await getJSON(`firms/${f.slug}/data/details.enc.json`);
    if (!env) throw new Error('This firm has no encrypted details file yet.');
    let rec;
    try { rec = await decryptJSON(env, pass); }
    catch {
      if (mine) { try { await forgetPass(f.slug); } catch {} }     // the firm's passphrase changed: drop the stale one
      throw new Error(typed ? 'That passphrase didn\'t work.' : mine ? 'The remembered passphrase no longer works, so it was forgotten. Type the current one below.' : 'The passphrase saved in this browser didn\'t work. Type it below.');
    }
    let team = !!mine;
    if (typed && remember) { try { team = !!(await rememberPass(f.slug, typed)); } catch { team = false; } }
    nip[f.slug] = { state: 'ok', list: notInPipelineList(rec), team };
  } catch (e) { nip[f.slug] = { state: 'error', err: e.message }; }
  repaint();
}

// v1.31.0: what Re-read GHL found, for the Done popup: pipelines and stages now, stages that weren't there before,
// pipelines renamed (same id, new name) and pipelines gone.
function rereadSummary(before, after) {
  const P = after?.pipelines || [], B = new Map((before?.pipelines || []).map(p => [p.id, p]));
  const seen = new Set((before?.pipelines || []).flatMap(p => (p.stages || []).map(x => x.id)));
  return {
    pipelines: P.length, stages: P.reduce((n, p) => n + (p.stages || []).length, 0),
    fresh: before ? P.reduce((n, p) => n + (p.stages || []).filter(x => !seen.has(x.id)).length, 0) : 0,
    renamed: P.filter(p => B.has(p.id) && B.get(p.id).name !== p.name).map(p => p.name),
    gone: before ? [...B.keys()].filter(id => !P.some(p => p.id === id)).length : 0,
  };
}

const stageChip = n => String(n).replace(/^stage\s*(\d+)\s*[:.\-–]\s*/i, '$1 ').replace(/\bconsultation\s+(?=showed|no show)/i, '').replace(/\s+[-–]\s+/g, ' · ').replace(/\bReferred Lead Accepted\?/i, 'Referred Accepted?');

function mappingPanel(host, { discovery, config, isNew, saveLabel, saveBtn = null, warnHost = null }) {
  const pipelines = discovery.pipelines || [];
  const state = initialState({ discovery, config, isNew });     // admin/mapping.mjs (also used by tests/mapping)
  const { chosenPipes, sel } = state;
  let keywords = state.keywords;
  const stageList = () => stagesOf(discovery, chosenPipes);

  return new Promise(resolve => {
    const draw = () => {
      const names = stageList(); const known = new Set(pipelines.flatMap(p => p.stages.map(s => norm(s.name))));
      host.innerHTML = `<div class="map">
        ${warnHost ? '' : '<div id="mapWarn" class="mapwarn"></div>'}
        <section><h4>Pipelines to include</h4><p class="hint">Only leads in these pipelines are counted.</p>
          <div class="pipes">${pipelines.map(p => `<label class="pipe"><input type="checkbox" data-pipe="${esc(p.id)}" ${chosenPipes.has(p.id) ? 'checked' : ''}> ${esc(p.name)} · ${p.stages.length} stage${p.stages.length === 1 ? '' : 's'}</label>`).join('') || '<p class="errbox">No pipelines found in this sub-account.</p>'}</div></section>
        <section><h4>Funnel steps</h4><p class="hint">Pick the stage(s) that first prove each step. A later step counts as every earlier one, so list only the stages that first prove it.</p>
          ${STEPS_MAP.map(([k, label, hint]) => {
            const extra = [...sel[k].entries()].filter(([n]) => !names.some(x => norm(x) === n));
            return `<div class="mrow" role="group" aria-label="${esc(label)}"><div class="lbl">${esc(label)}<span class="hint">${esc(hint)}</span></div><div class="opts">
              ${names.map(n => `<button type="button" class="opt" data-step="${k}" data-stage="${esc(n)}" aria-pressed="${sel[k].has(norm(n))}" title="${esc(n)}">${esc(stageChip(n))}</button>`).join('')}
              ${extra.map(([, n]) => `<button type="button" class="opt stale" data-step="${k}" data-stage="${esc(n)}" aria-pressed="true" title="${esc(n)}: ${known.has(norm(n)) ? 'in a pipeline you excluded' : 'not found in GHL any more'}">${esc(stageChip(n))} · ${known.has(norm(n)) ? 'excluded pipeline' : 'not in GHL'}</button>`).join('')}
              ${!names.length && !extra.length ? '<span class="muted small">Choose a pipeline first.</span>' : ''}</div></div>`;
          }).join('')}</section>

          ${(discovery.calendars || []).length ? `<p class="hint" style="margin:12px 0 8px">Calendars in GHL (click to add one as a keyword):</p><div class="opts">${discovery.calendars.map(c => `<button type="button" class="opt cal" data-cal="${esc(c.name)}">${esc(c.name)}</button>`).join('')}</div>` : '<p class="hint" style="margin:12px 0 0">This sub-account has no calendars.</p>'}
        </section>
        ${saveBtn ? '' : `<div class="btnrow"><button type="button" class="btn primary big" id="mapSave">${esc(saveLabel)}</button></div>`}
      </div>`;
      if (warnHost) warnHost.innerHTML = '<div id="mapWarn" class="mapwarn"></div>';
      host.querySelectorAll('[data-pipe]').forEach(c => c.addEventListener('change', () => { c.checked ? chosenPipes.add(c.dataset.pipe) : chosenPipes.delete(c.dataset.pipe); keywords = parseKw(); draw(); }));
      host.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
        const m = sel[b.dataset.step], n = b.dataset.stage, on = b.getAttribute('aria-pressed') !== 'true';
        on ? m.set(norm(n), n) : m.delete(norm(n));
        if (b.classList.contains('stale') && !on) { keywords = parseKw(); draw(); } else b.setAttribute('aria-pressed', String(on));
      }));
      host.querySelectorAll('[data-cal]').forEach(b => b.addEventListener('click', () => {
        const kw = parseKw(); if (!kw.some(k => norm(k) === norm(b.dataset.cal))) kw.push(b.dataset.cal); $('calKw').value = kw.join(', ');
      }));
      let warned = false;
      const save = saveBtn || $('mapSave');
      save.disabled = false; save.textContent = saveLabel;
      save.onclick = () => {
        const chosen = pipelines.filter(p => chosenPipes.has(p.id)).map(p => p.name);
        const warn = [];
        if (!chosen.length) { $('mapWarn').innerHTML = '<div class="errbox">Pick at least one pipeline.</div>'; return; }
        for (const [k, label] of STEPS_MAP.slice(0, 6)) if (!sel[k].size) warn.push(label);

        }
        save.onclick = null;
        resolve(buildMapping({ ...state, keywords: parseKw() }, discovery));
      };
    };
    const parseKw = () => ($('calKw')?.value ?? keywords.join(',')).split(',').map(s => s.trim()).filter(Boolean);
    draw();
  });
}

const WORDS = 'acorn amber anchor apple arrow aspen autumn badge bamboo banjo barley basil beacon berry birch blossom bonfire breeze brook cactus candle canyon carbon cedar cherry cinder citrus clover cobalt comet copper coral cotton crater cricket crystal daisy delta desert dolphin dragon ember falcon fern fiddle flint forest fossil galaxy garnet ginger glacier granite harbor hazel heron hickory honey horizon indigo island ivory jasmine juniper kettle kiwi lagoon lantern lemon lilac linen lotus maple marble meadow mesa mint monarch mosaic nectar nickel nutmeg oasis ocean olive onyx orbit orchid otter paddle pebble pepper pine planet plum polar poppy prairie quartz quill raven reef ribbon river robin saffron sage salmon sapphire sequoia shadow silver sparrow spruce summit sunset thistle thunder timber topaz tulip tundra valley velvet violet walnut willow winter yarrow zephyr'.split(' ');
function makePassphrase() {
  const out = [];
  while (out.length < 4) { const r = crypto.getRandomValues(new Uint32Array(1))[0]; const lim = Math.floor(2 ** 32 / WORDS.length) * WORDS.length; if (r < lim) { const w = WORDS[r % WORDS.length]; if (!out.includes(w)) out.push(w); } }
  return out.join('-');
}

const RUN_STEPS = ['Save token', "Read the firm's GHL setup", 'Map the stages', 'Create the dashboard', 'First sync', 'Done'];
let run = null;                       // { ctx, timer, t0, stopped }
function cleanupRun() { if (run) { run.stopped = true; clearInterval(run.timer); if (run.ctx) { run.ctx.token = null; run.ctx.passphrase = null; } run = null; } }

function startRun(ctx) {

    <div data-lv-jobhost="newfirm"></div>
    <ol class="steps" id="runSteps">${RUN_STEPS.map((t, i) => `<li class="step pending" data-i="${i}"><span class="ic" aria-hidden="true"></span><span class="t">${i + 1}. ${esc(t)}</span><span class="d"></span><div class="e"></div><div class="slot"></div></li>`).join('')}</ol>`;

function setStep(i, state, detail) {
  const el = stepEl(i); if (!el) return;

  el.querySelector('.ic').innerHTML = state === 'ok' ? ICON.tick : state === 'fail' ? ICON.cross : '';

async function runFrom(i) {

      myRun.job?.fail({ reason: errText(e), nothingChanged: i === 0 ? 'no firm was added.' : false, line: 'Scorecard setup didn\'t finish', onRetry: () => $('retryBtn')?.click() }); myRun.job = null;
      const indexWritten = i >= 4, scopeUi = e.kind === 'scopes';
      stepEl(i).querySelector('.e').innerHTML = `<div class="${scopeUi ? 'warnbox' : 'errbox'}">${errHtml(e)}</div>
        ${e.newToken ? `<label class="f" for="reTok" style="margin-top:10px">New GHL token<span class="pw"><input type="password" id="reTok" autocomplete="off" spellcheck="false" placeholder="pit-…"><button type="button" class="eye" data-eye="reTok" aria-label="Show token"></button></span></label><div class="ferr" id="reTokErr"></div>` : ''}
        <div class="btnrow">
        <button type="button" class="btn primary" id="retryBtn">${scopeUi ? (e.newToken ? 'Save token and re-check' : 'Re-check') : 'Retry from this step'}</button>
        ${scopeUi ? `<a class="btn" href="${esc(piUrl(myRun.ctx.locationId))}" target="_blank" rel="noopener">${ICON.ext}Open Private Integrations</a>` : ''}
        <button type="button" class="btn danger" id="discardBtn">${indexWritten ? 'Delete this firm' : 'Discard and clean up'}</button></div>`;
      wireEyes(stepEl(i));
      $('retryBtn').onclick = () => {
        if (e.newToken) {
          const t = $('reTok').value.trim();
          if (t.length < 20) { $('reTokErr').textContent = 'Paste the new GHL token.'; return; }
          myRun.ctx.token = t; $('reTok').value = '';
          for (let k = 0; k <= i; k++) setStep(k, 'pending', '');
          return runFrom(0);           // save the new token, then re-check
        }
        stepEl(i).querySelector('.e').innerHTML = ''; runFrom(i);
      };
      $('discardBtn').onclick = async () => {
        $('retryBtn').disabled = true; busyButton($('discardBtn'), 'Cleaning up…', { ms: 15000 });
        try { await deleteFirm(myRun.ctx.slug, myRun.ctx.secretKey, myRun.ctx.name); go('#/', `Discarded ${esc(myRun.ctx.name)}: secrets and any files removed.`); }
        catch (err) { stepEl(i).querySelector('.e').insertAdjacentHTML('beforeend', `<div class="errbox" style="margin-top:8px">${esc(err.message)}</div>`); $('discardBtn').disabled = false; $('discardBtn').textContent = 'Try clean-up again'; }
      };
      return;
    }
  }
  clearInterval(myRun.timer); myRun.timer = null;
  myRun.job?.done({ title: `Done: ${myRun.ctx.name}'s scorecard set up`, lead: 'Synced. The dashboard and the GHL menu link are on this page.', line: 'Scorecard set up', items: [['Dashboard', myRun.ctx.slug], ['Token', 'Private Integration']] });
  myRun.job = null;
}

const STEP_FNS = [
  // 1. Save token
  async (ctx, say) => {
    say('Encrypting with the repo key and saving 2 secrets…');
    await putSecret(`GHL_TOKEN_${ctx.secretKey}`, ctx.token);
    await putSecret(`PASSPHRASE_${ctx.secretKey}`, ctx.passphrase);
    try { await rememberPass(ctx.slug, ctx.passphrase); } catch {}   // v1.16.0: remembered for the team too (never blocks)
    say(`Saved <span class="mono">GHL_TOKEN_${esc(ctx.secretKey)}</span> and <span class="mono">PASSPHRASE_${esc(ctx.secretKey)}</span>.`);
  },
  // 2. Read the firm's GHL setup
  async (ctx, say) => {
    const t0 = await dispatch('discover.yml', { slug: ctx.slug, secretKey: ctx.secretKey, locationId: ctx.locationId });
    const { value } = await follow({ workflow: 'discover.yml', title: `Discover ${ctx.slug}`, t0, label: 'Reading GHL', limitMs: 3 * 60e3, say, stop: ctx.stop,
      check: async () => { const d = await getJSON(`firms/${ctx.slug}/discovery.json`); return d && d.locationId === ctx.locationId && Date.parse(d.generatedAt) > t0 - 120e3 ? d : null; } });
    const problem = scopeProblem(value.scopes, ctx.locationId);
    if (problem) throw problem;
    if (!value.pipelines?.length) throw new Error('GHL returned no pipelines for this location. Check the location ID and that the token belongs to this sub-account.');
    ctx.discovery = value;
    const nStages = value.pipelines.reduce((n, p) => n + p.stages.length, 0);
    const unchecked = value.scopes?.unchecked || [];
    say(`All ${value.scopes ? value.scopes.ok.length : ''} scopes OK. Found ${value.pipelines.length} pipeline${value.pipelines.length === 1 ? '' : 's'}, ${nStages} stage${nStages === 1 ? '' : 's'} and ${value.calendars?.length || 0} calendar${value.calendars?.length === 1 ? '' : 's'}.${unchecked.length ? ` Couldn't test ${unchecked.map(k => esc(scopeName(k))).join(', ')} (nothing to read yet).` : ''}`);
  },
  // 3. Map the stages (waits for the user)
  async (ctx, say, slot) => {
    say('Check the stages below, then press Continue. Stages matching the ACME template are already picked.');
    const tpl = await getJSON('firms/_template/config.json');
    if (!tpl) throw new Error('firms/_template/config.json is missing from the repo.');
    ctx.mapping = await mappingPanel(slot, { discovery: ctx.discovery, config: ctx.mapping ? applyMapping(structuredClone(tpl), ctx.mapping) : tpl, isNew: !ctx.mapping, saveLabel: 'Continue' });
    slot.innerHTML = '';
    const n = Object.values(ctx.mapping.stages).flat().length + ctx.mapping.turnedAway.length;
    say(`${ctx.mapping.pipelines.map(esc).join(', ')} · ${n} stage selection${n === 1 ? '' : 's'} · calendars: ${ctx.mapping.calendarKeywords.length ? ctx.mapping.calendarKeywords.map(esc).join(', ') : 'all'}.`);
  },
  // 4. Create the dashboard: config.json + stub + index.json in one commit (index.json is only ever written here)
  async (ctx, say) => {
    say('Writing config.json, the dashboard page and the firm list…');
    await commitFiles(`Add ${ctx.name}`, async head => {
      const index = (await getJSON('firms/index.json', head)) || [];
      if (index.some(f => f.slug === ctx.slug)) throw new Error(`"${ctx.slug}" is already in the firm list.`);
      const tpl = await getJSON('firms/_template/config.json', head);
      const stub = await getText('firms/_template/index.html', head);
      if (!tpl || !stub) throw new Error('The firms/_template files are missing.');
      const cfg = applyMapping(structuredClone(tpl), ctx.mapping);
      // Firm-specific values only; targets, notice, channels etc. come from firms/_defaults.json.
      Object.assign(cfg, { locationName: ctx.name, practiceArea: ctx.practiceArea, locationId: ctx.locationId, title: '', timezone: ctx.timezone });
      index.push({ slug: ctx.slug, secretKey: ctx.secretKey, name: ctx.name, practiceArea: ctx.practiceArea, locationId: ctx.locationId, createdAt: new Date().toISOString() });
      return [
        { path: `firms/${ctx.slug}/config.json`, content: jsonText(cfg) },
        { path: `firms/${ctx.slug}/index.html`, content: stub },
        { path: 'firms/index.json', content: jsonText(index) },
      ];
    });
    say(`Committed "Add ${esc(ctx.name)}".`);
  },
  // 5. First sync
  async (ctx, say) => {
    const t0 = await dispatch('sync.yml', { slug: ctx.slug });
    const { value } = await follow({ workflow: 'sync.yml', title: `Sync ${ctx.slug}`, t0, label: 'Syncing', limitMs: 8 * 60e3, say, stop: ctx.stop,
      check: async () => { const k = await getJSON(`firms/${ctx.slug}/data/kpis.json`); return k?.generatedAt ? k : null; } });
    ctx.kpis = value;
    say(`Synced at ${esc(fmtTime(value.generatedAt))}.`);
  },
  // 6. Done
  async (ctx, say, slot) => {
    const leads = ctx.kpis?.periods?.last90?.current?.totalLeads;
    const link = ghlLink(ctx.slug, ctx.passphrase);
    say('');
    slot.innerHTML = `<div class="success">
      <div><h2>${esc(ctx.name)} is live</h2><p class="sub">${leads != null ? `First sync found <b>${leads}</b> lead${leads === 1 ? '' : 's'} in the last 90 days.` : 'First sync finished.'} The dashboard may take a minute to appear while GitHub Pages publishes.</p></div>
      <label class="f">Dashboard<span class="copyrow"><input type="text" readonly value="${esc(dashUrl(ctx.slug))}"><a class="btn" href="${esc(dashUrl(ctx.slug))}" target="_blank" rel="noopener">${ICON.ext}Open</a></span></label>
      <label class="f" for="ghlLinkOut">GHL menu link <span class="hint">Includes the passphrase, so names unlock for the firm's team.</span><span class="copyrow"><input type="password" id="ghlLinkOut" readonly value="${esc(link)}"><button type="button" class="eye" data-eye="ghlLinkOut" aria-label="Show link" style="position:static;transform:none"></button><button type="button" class="btn primary" id="copyGhl">${ICON.copy}Copy</button></span></label>
      <div><b class="small">Two steps left in GHL</b><ul>
        <li>In ${esc(ctx.name)}'s sub-account: Settings → Custom Menu Links → create "KPI Dashboard" with the GHL menu link above.</li>
        <li>Ask the firm's team to move every opportunity through the pipeline stages, so each funnel step can be measured.</li></ul></div>
      <div class="btnrow" style="margin-top:0"><button type="button" class="btn" id="toList">Back to all firms</button></div></div>`;
    wireEyes(slot);
    $('copyGhl').onclick = async () => { try { await navigator.clipboard.writeText(link); const b = $('copyGhl'); b.innerHTML = `${ICON.tick}Copied`; setTimeout(() => { if (document.body.contains(b)) b.innerHTML = `${ICON.copy}Copy`; }, COPIED_MS); } catch { $('ghlLinkOut').type = 'text'; $('ghlLinkOut').select(); } };
    $('toList').onclick = () => go('#/', `Added ${esc(ctx.name)}.`);
    ctx.token = null;                     // the GHL token is no longer needed in memory
  },
];

// =====================================================================
// Edit mapping
// =====================================================================
async function renderEditMapping(f) {
  cleanupRun();
  closeMenus();
  $('screen').innerHTML = `<header class="head"><div class="titles"><button class="back" type="button" id="backBtn">${ICON.back}All firms</button><h1 class="disp" id="emTitle">${careOf(f) ? 'Map <span class="g">pipelines.</span>' : 'Edit <span class="g">mapping.</span>'}</h1><p class="sub">${esc(f.name)} · <span class="mono">${esc(f.slug)}</span><span id="emAsOf"></span></p></div>
    <div class="controls"><button class="btn big" type="button" id="rereadBtn">${ICON.sync}Re-read GHL</button><button class="btn p big" type="button" id="emSave" disabled>Save mapping</button></div></header>
    <div id="emStatus" aria-live="polite"></div><div data-lv-jobhost="map:${esc(f.slug)}"></div><div id="emWarn"></div><div id="emType"></div><div id="emHost"><p class="sub">Loading…</p></div>`;
  $('backBtn').onclick = () => go('#/');
  const host = $('emHost'); const stop = () => !document.body.contains(host);
  const status = h => { $('emStatus').innerHTML = h ? `<div class="note" style="margin-bottom:16px">${h}</div>` : ''; };
  const load = async () => {
    const [cfg, disc] = await Promise.all([getJSON(`firms/${f.slug}/config.json`), getJSON(`firms/${f.slug}/discovery.json`)]);
    if (stop()) return;
    if (!cfg) { $('emHost').innerHTML = '<div class="errbox">config.json not found for this firm.</div>'; return; }
    if (!disc) { $('emHost').innerHTML = `<div class="warnbox">There's no snapshot of this firm's GHL pipelines yet. Press <b>Re-read GHL</b> to take one (about a minute).</div>`; return; }
    status('');
    $('emAsOf').textContent = ` · pipelines read ${fmtTime(disc.generatedAt)} (${ago(disc.generatedAt)})`;
    const problem = scopeProblem(disc.scopes, cfg.locationId || f.locationId);
    if (problem) {
      $('emStatus').insertAdjacentHTML('beforeend', `<div class="warnbox" style="margin-bottom:12px">${problem.message.replace(/Then press Re-check\.|Create a token in that sub-account and paste it below\./, '')}
        ${problem.newToken ? `The firm's token is stored as <span class="mono">GHL_TOKEN_${esc(f.secretKey)}</span>; delete and re-add the firm, or replace that secret in GitHub.` : ''}
        <div class="btnrow"><button type="button" class="btn primary" id="recheckBtn">${ICON.sync}Re-check</button><a class="btn" href="${esc(piUrl(cfg.locationId || f.locationId))}" target="_blank" rel="noopener">${ICON.ext}Open Private Integrations</a></div></div>`);
      $('recheckBtn').onclick = () => $('rereadBtn').click();
    }
    // v1.28.0: practice type first. Law firm = the stage-mapping panel below (unchanged); Medical & dental / Other =
    // Map pipelines (bucket per stage, stored by id). Switching redraws the panel; nothing is saved until Save.
    let type = practiceTypeOf(cfg);
    const carePreset = await carePresetFor(cfg.locationId || f.locationId);
    if (stop()) return;
    const paintType = () => {
      $('emType').innerHTML = `<fieldset class="connect emtype"><legend class="ey">Practice type</legend><div class="seg-type" role="radiogroup" aria-label="Practice type">
        ${PRACTICE_TYPES.map(([v, l]) => `<label class="opt-card sm"><input type="radio" name="emType" value="${v}"${v === type ? ' checked' : ''}><span><span class="t">${esc(l)}</span></span></label>`).join('')}</div>
        ${type !== practiceTypeOf(cfg) ? `<p class="hint">Changing from <b>${esc(practiceLabel(practiceTypeOf(cfg)))}</b>. ${type === 'law' ? 'The firm\'s earlier law mapping is shown; saving switches it back to law-firm counting.' : 'Saving switches this firm to people counting with the mapping below. Its law mapping is kept in case you switch back.'}</p>` : ''}</fieldset>`;
      document.querySelectorAll('input[name="emType"]').forEach(r => r.addEventListener('change', () => { type = r.value; $('emWarn').innerHTML = ''; paintType(); panel(); }));
      $('emTitle').innerHTML = type === 'law' ? 'Edit <span class="g">mapping.</span>' : 'Map <span class="g">pipelines.</span>';
      shell?.setTitle(type === 'law' ? 'Edit mapping' : 'Map pipelines');   // the phone top bar says the same
    };
    const panel = async () => {
      if (type !== 'law') {
        // Still "Needs mapping": what new-firm saved is only a pre-fill, so it's shown as Pre-filled / Guessed to confirm, not Saved.
        const r = await carePanel($('emHost'), { discovery: disc, config: needsMap(f) ? { ...cfg, pipelineMap: undefined } : cfg, type, preset: carePreset, saveBtn: $('emSave'), warnHost: $('emWarn') });
        return saveCare(r);
      }
      const m = await mappingPanel($('emHost'), { discovery: disc, config: cfg, isNew: false, saveLabel: 'Save mapping', saveBtn: $('emSave'), warnHost: $('emWarn') });
      return saveLaw(m);
    };
    const resync = async (what, job) => {
      job?.line(`${what.charAt(0).toUpperCase() + what.slice(1)} saved. Syncing ${fname(f)} so the dashboard uses it…`);
      const t0 = await dispatch('sync.yml', { slug: f.slug });
      const { value } = await follow({ workflow: 'sync.yml', title: `Sync ${f.slug}`, t0, label: 'Syncing', limitMs: 8 * 60e3, stop: () => false, say: () => {},
        check: async () => { const k = await getJSON(`firms/${f.slug}/data/kpis.json`); return k && Date.parse(k.generatedAt) > t0 - 60e3 ? k : null; } });
      return value;
    };
    const saveCare = async r => {
      const doSaveCare = async () => {
        $('emHost').querySelectorAll('button,input').forEach(el => { el.disabled = true; }); $('emType').querySelectorAll('input').forEach(el => { el.disabled = true; });
        $('emSave').disabled = true; $('emSave').onclick = null;
        status('');
        const job = kpiJob({ kind: 'savemap', client: fname(f), what: 'Save mapping', title: `Saving ${fname(f)}'s pipeline mapping…`, host: `map:${f.slug}`, typicalMs: 120000 });
        let saved = false;
        try {
          let row = null;
          await commitFiles(`Map pipelines for ${f.name} (${practiceLabel(type)})`, async head => {
            const c = await getJSON(`firms/${f.slug}/config.json`, head);
            const next = applyCare(c, { practiceType: type, pipelineMap: r.pipelineMap, countsOnly: r.countsOnly });
            const list = await getJSON('firms/index.json', head);
            row = (list || []).find(x => x.slug === f.slug); if (!row) throw new Error('This firm is no longer in the firm list.');
            row.practiceType = type;
            if (row.status === 'needsMapping') row.status = 'draft';   // mapped: it syncs from now on, as a Draft until published
            return [{ path: `firms/${f.slug}/config.json`, content: jsonText(next) }, { path: 'firms/index.json', content: jsonText(list) }];
          });
          Object.assign(f, { practiceType: row.practiceType, status: row.status });
          saved = true;
          const k = await resync('mapping', job);
          kpis[f.slug] = kpiSummary(k); kpiFull[f.slug] = k;
          if (!stop()) go('#/');
          job.done({ title: 'Done: mapping saved', lead: `${fname(f)} · synced with the new mapping${f.status === 'draft' ? ' (Draft)' : ''}.`, line: 'Mapping saved', detail: f.status === 'draft' ? 'Draft' : '',
            items: [['Pipelines counted', String(r.pipelineMap.pipelines.filter(x => x.use).length)], ['Stages mapped', String(Object.keys(r.pipelineMap.stages).length)], ['Status', f.status === 'draft' ? 'Draft' : 'Live']] });
        } catch (e) {
          job.fail(saved ? { reason: `The mapping was saved, but the sync didn't finish: ${errText(e)} The next sync (within 30 min) uses it.`, line: 'Mapping saved, sync didn\'t finish', onRetry: () => resyncFirm(f) }
            : { reason: errText(e), nothingChanged: 'the mapping is the same as before.', line: 'Mapping not saved', onRetry: () => $('emSave')?.onclick?.() });
          if (stop()) return;
          if (saved) { go('#/'); return; }
          status(''); $('emWarn').innerHTML = `<div class="errbox" style="margin-bottom:16px">${errHtml(e)}</div>`;
          $('emHost').querySelectorAll('button,input').forEach(el => { el.disabled = false; }); $('emType').querySelectorAll('input').forEach(el => { el.disabled = false; });
          $('emSave').disabled = false; $('emSave').textContent = 'Save mapping'; $('emSave').onclick = doSaveCare;
        }
      };
      await doSaveCare();
    };
    paintType();
    panel().catch(e => { if (!stop()) $('emHost').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; });
  };
  const saveLaw = async m => {
    const doSave = async () => {
    $('emHost').querySelectorAll('button,input').forEach(el => { el.disabled = true; }); $('emSave').disabled = true; $('emSave').onclick = null;
    status('');
    const job = kpiJob({ kind: 'savemap', client: fname(f), what: 'Save mapping', title: `Saving ${fname(f)}'s mapping…`, host: `map:${f.slug}`, typicalMs: 120000 });
    let saved = false;
    try {
      const wasCare = careOf(f);
      await commitFiles(`Update stage mapping for ${f.name}`, async head => {
        const c = await getJSON(`firms/${f.slug}/config.json`, head);
        const next = applyMapping(c, m); delete next.mappingReview;   // a saved mapping clears the builder's "Review mapping" flag
        if (!wasCare) return [{ path: `firms/${f.slug}/config.json`, content: jsonText(next) }];
        // v1.28.0: switched back to Law firm. The people-counting settings stay in config.json (unused) in case of a switch back.
        delete next.practiceType;
        const list = await getJSON('firms/index.json', head), row = (list || []).find(x => x.slug === f.slug);
        if (row) { delete row.practiceType; if (row.status === 'needsMapping') row.status = 'draft'; }
        return [{ path: `firms/${f.slug}/config.json`, content: jsonText(next) }, ...(row ? [{ path: 'firms/index.json', content: jsonText(list) }] : [])];
      });
      if (wasCare) { delete f.practiceType; if (f.status === 'needsMapping') f.status = 'draft'; }
      saved = true;
      job.line(`Mapping saved. Re-syncing ${fname(f)} so the dashboard uses it…`);
      const t0 = await dispatch('sync.yml', { slug: f.slug });
      const { value: k } = await follow({ workflow: 'sync.yml', title: `Sync ${f.slug}`, t0, label: 'Syncing', limitMs: 8 * 60e3, stop: () => false, say: () => {},
        check: async () => { const x = await getJSON(`firms/${f.slug}/data/kpis.json`); return x && Date.parse(x.generatedAt) > t0 - 60e3 ? x : null; } });
      kpis[f.slug] = kpiSummary(k); kpiFull[f.slug] = k;
      if (!stop()) go('#/');
      job.done({ title: 'Done: mapping saved', lead: `${fname(f)} · re-synced, so the dashboard uses the new mapping.`, line: 'Mapping saved', detail: leads90(k) != null ? `${leads90(k)} leads` : '',
        items: [...(leads90(k) != null ? [['Leads (last 90 days)', String(leads90(k))]] : []), ['Status', f.status === 'draft' ? 'Draft' : 'Live']] });
    } catch (e) {
      job.fail(saved ? { reason: `The mapping was saved, but the re-sync didn't finish: ${errText(e)} The next sync (within 30 min) uses it.`, line: 'Mapping saved, re-sync didn\'t finish', onRetry: () => resyncFirm(f) }
        : { reason: errText(e), nothingChanged: 'the mapping is the same as before.', line: 'Mapping not saved', onRetry: () => $('emSave')?.onclick?.() });
      if (stop()) return;
      if (saved) { go('#/'); return; }
      status(''); $('emWarn').innerHTML = `<div class="errbox" style="margin-bottom:16px">${errHtml(e)}</div>`;
      $('emHost').querySelectorAll('button,input').forEach(el => { el.disabled = false; });
      $('emSave').disabled = false; $('emSave').textContent = 'Save mapping'; $('emSave').onclick = doSave;   // save the same mapping again
    }
    };
    await doSave();
  };
  $('rereadBtn').onclick = async () => {
    $('rereadBtn').disabled = true;
    // v1.31.0 (Part 2): the cyclist while GHL is read, then the Done / Didn't work popup with what changed
    const name = fname(f);
    const job = kpiJob({ kind: 'reread', client: name, what: 'Re-read GHL', title: `Reading ${name}'s pipelines from GHL…`, host: `map:${f.slug}`, typicalMs: 50000,
      check: { workflow: 'discover.yml', title: `Discover ${f.slug}` }, doneText: { title: 'Done: pipelines updated', lead: `${name}'s pipelines were read again from GHL.` } });
    try {
      status('');
      const [cfg, before] = await Promise.all([getJSON(`firms/${f.slug}/config.json`), getJSON(`firms/${f.slug}/discovery.json`).catch(() => null)]);
      const t0 = await dispatch('discover.yml', { slug: f.slug, secretKey: f.secretKey, locationId: cfg?.locationId || f.locationId || '' });
      const { value: d } = await follow({ workflow: 'discover.yml', title: `Discover ${f.slug}`, t0, label: 'Reading GHL', limitMs: 3 * 60e3, stop, say: () => {},
        check: async () => { const x = await getJSON(`firms/${f.slug}/discovery.json`); return x && Date.parse(x.generatedAt) > t0 - 120e3 ? x : null; } });
      // Redraw the panel from the fresh snapshot. load() only finishes when the mapping is saved, so don't wait for it.
      load().catch(e => { if (!stop()) $('emHost').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; });
      const r = rereadSummary(before, d);
      job.done({ title: 'Done: pipelines updated', lead: `${name}'s pipelines were read again from GHL.`, line: 'Pipelines updated from GHL',
        detail: `${r.stages} stage${r.stages === 1 ? '' : 's'}${r.fresh ? ` · ${r.fresh} new stage${r.fresh === 1 ? '' : 's'} to map` : ''}`,
        items: [['Pipelines', String(r.pipelines)], ['Stages', `${r.stages}${r.fresh ? ` · ${r.fresh} new` : ' · no new stages'}`], ...r.renamed.map(x => ['Changed', `name now "${x}"`]), ...(r.gone ? [['Gone from GHL', `${r.gone} pipeline${r.gone === 1 ? '' : 's'}`]] : [])],
        next: { label: 'Review mapping', onClick: () => $('emType')?.scrollIntoView({ behavior: 'smooth', block: 'start' }) } });
    } catch (e) {
      job.fail({ reason: errText(e), nothingChanged: 'the mapping is the same as before.', line: 'Couldn\'t read GHL', onRetry: () => $('rereadBtn')?.click() });
    }
    finally { const b = $('rereadBtn'); if (b) b.disabled = false; }
  };
  try { await load(); } catch (e) { if (!stop()) $('emHost').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
}

wireEyes();
boot();
</script>
